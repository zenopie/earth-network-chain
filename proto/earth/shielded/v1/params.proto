syntax = "proto3";
package earth.shielded.v1;

import "amino/amino.proto";
import "cosmos_proto/cosmos.proto";
import "gogoproto/gogo.proto";

option go_package = "github.com/earth-network/earth/x/shielded/types";

// Params defines the parameters of the shielded pool.
message Params {
  option (amino.name) = "earth/x/shielded/Params";
  option (gogoproto.equal) = true;
  // REQUIRED because of the verifying_keys map: without it gogoproto marshals
  // map entries in Go's randomised order and validators disagree on the bytes
  // of Params (see x/personhood Params).
  option (gogoproto.stable_marshaler) = true;

  // verifying_keys maps a circuit name ("action", "membership") to its
  // Barretenberg UltraHonk (bb v5.0.0) verifying key. A private msg whose
  // circuit has no key is refused.
  map<string, bytes> verifying_keys = 1;

  // min_fee is the consensus floor on a private tx's fee, in uerth. Never
  // below 1: there is no configuration that admits a zero-fee private tx.
  // Nodes additionally require fee >= min-gas-price * gas in CheckTx.
  string min_fee = 2 [
    (cosmos_proto.scalar) = "cosmos.Int",
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];

  // proof_verification_gas is charged per action (one action proof), before
  // it is verified, whatever the outcome, and also in simulate mode.
  uint64 proof_verification_gas = 3;

  // note_gas is charged per nullifier spent and per commitment appended (two
  // per action), and per note a private action mints. Private msgs execute
  // their pool writes on an infinite gas meter after paying this fixed price
  // up front, so a private tx's gas is a function of its shape alone and
  // cannot run out halfway through.
  uint64 note_gas = 4;

  // root_window_seconds is how long a note-tree root stays a valid anchor
  // after the block that produced it. The latest root is always valid.
  uint64 root_window_seconds = 5;

  // max_private_actions_per_block caps how many actions (proofs) the private
  // txs that pass their ante in one block carry in total. A tx whose ante
  // fails (a bad proof, a spent nullifier) is not counted: its count is
  // written with the ante's other writes and discarded with them. Block gas
  // bounds the verification work of failed txs too: each proof's
  // proof_verification_gas is charged before any proof is verified, and that
  // gas counts toward the block's max_gas whether or not the ante fails.
  uint32 max_private_actions_per_block = 6;

  // max_actions_per_bundle caps one bundle: 2 (the padding minimum) to 32
  // (zk/orchard.MaxActions, part of the balance's soundness bound).
  uint32 max_actions_per_bundle = 7;

  // bundle_gas is charged per bundle on top of its actions: the sighash,
  // the binding key and the binding signature.
  uint64 bundle_gas = 8;
}
