syntax = "proto3";
package earth.shielded.v1;

import "amino/amino.proto";
import "cosmos/base/v1beta1/coin.proto";
import "cosmos/msg/v1/msg.proto";
import "cosmos_proto/cosmos.proto";
import "earth/shielded/v1/params.proto";
import "earth/shielded/v1/shielded.proto";
import "gogoproto/gogo.proto";

option go_package = "github.com/earth-network/earth/x/shielded/types";

// Msg defines the shielded pool's Msg service.
service Msg {
  option (cosmos.msg.v1.service) = true;

  // UpdateParams updates the module parameters (governance).
  rpc UpdateParams(MsgUpdateParams) returns (MsgUpdateParamsResponse);

  // RegisterAsset admits a denom to the pool (governance).
  rpc RegisterAsset(MsgRegisterAsset) returns (MsgRegisterAssetResponse);

  // Shield moves the signer's coins into the pool as one note.
  rpc Shield(MsgShield) returns (MsgShieldResponse);

  // Send spends notes through a bundle: a private send, and optionally an
  // unshield to a transparent receiver. Unsigned; see MsgSend.
  rpc Send(MsgSend) returns (MsgSendResponse);
}

// MsgUpdateParams is the Msg/UpdateParams request type.
message MsgUpdateParams {
  option (cosmos.msg.v1.signer) = "authority";
  option (amino.name) = "earth/x/shielded/MsgUpdateParams";

  // authority is the address that controls the module (x/gov by default).
  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  // params defines the module parameters to update. All must be supplied.
  Params params = 2 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
}

// MsgUpdateParamsResponse is empty.
message MsgUpdateParamsResponse {}

// MsgRegisterAsset admits denom to the pool. Admission is permanent: notes
// of a denom can always be spent and unshielded.
message MsgRegisterAsset {
  option (cosmos.msg.v1.signer) = "authority";
  option (amino.name) = "earth/x/shielded/MsgRegisterAsset";

  // authority is the address that controls the module (x/gov by default).
  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  // denom to admit.
  string denom = 2;
}

// MsgRegisterAssetResponse returns the denom's asset id.
message MsgRegisterAssetResponse {
  bytes asset_id = 1;
}

// MsgShield moves amount from sender into the pool and appends the note
// cm = H(TAG_CM, AssetID(amount.denom), amount.amount, pc). The chain needs
// no proof: the asset and value are public, and pc hides the owner. Signed
// and fee-paying like any transparent tx.
message MsgShield {
  option (cosmos.msg.v1.signer) = "sender";
  option (amino.name) = "earth/x/shielded/MsgShield";

  string sender = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  // amount of a registered denom, at most 2^64 - 1 (note values are u64).
  cosmos.base.v1beta1.Coin amount = 2 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  // pc = H(TAG_PC, owner_pk, rho, rcm), 32 bytes.
  bytes pc = 3;
  // ciphertext is the note's amount-blind v2 ciphertext (zk/privacy
  // EncryptBlindNote: rho, rcm, memo to the owner's ek_pub), exactly 177
  // bytes. Required: every note the chain mints to a hidden owner carries
  // one, so a wallet finds every note by trial decryption alone.
  bytes ciphertext = 4;
}

// MsgShieldResponse returns the note's position and commitment.
message MsgShieldResponse {
  uint64 position = 1;
  bytes commitment = 2;
}

// MsgSend spends shielded notes through one bundle. It has NO signer: its
// signers are defined as empty (x/tx CustomGetSigner), it travels in a tx
// with no signatures, and its fee is paid from the pool out of the bundle's
// uerth balance. Authorization is the proofs and the binding signature;
// replay protection is the nullifiers.
//
// Release map: the bundle's uerth balance pays fee to fee_collector; every
// other unit of every balance (the uerth rest included) goes to receiver.
// With no receiver the balances must be exactly the fee.
//
// sighash = zk/orchard.Sighash("/earth.shielded.v1.MsgSend", chain_id,
// [bundle], Bytes(receiver address bytes), fee), so neither the receiver,
// the fee, a ciphertext nor any balance can be changed by whoever relays it.
message MsgSend {
  Bundle bundle = 1 [(gogoproto.nullable) = false];
  // receiver gets every balance less the fee. Required exactly when the
  // balances exceed the fee.
  string receiver = 2 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  // fee is the uerth the bundle pays to fee_collector; the tx's declared fee
  // must equal it. An unshield of uerth pays it out of what it releases (a
  // fee from output), with no separate fee note.
  uint64 fee = 3;
}

// MsgSendResponse returns the positions of the bundle's new notes, in
// action order.
message MsgSendResponse {
  repeated uint64 positions = 1;
}
