syntax = "proto3";
package earth.deflation.v1;

import "amino/amino.proto";
import "cosmos_proto/cosmos.proto";
import "gogoproto/gogo.proto";

option go_package = "github.com/earth-network/earth/x/deflation/types";

// Params defines the parameters for the module.
message Params {
  option (amino.name) = "earth/x/deflation/Params";
  option (gogoproto.equal) = true;

  // address_option_fee is the ERTH (uerth) burned to add an ADDRESS allocation
  // option. Adding an ADDRESS option is permissionless; this fee deters spam.
  uint64 address_option_fee = 1;
}
