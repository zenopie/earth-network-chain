syntax = "proto3";

package earth.deflation.v1;

import "amino/amino.proto";
import "cosmos/msg/v1/msg.proto";
import "cosmos_proto/cosmos.proto";
import "earth/deflation/v1/allocation.proto";
import "earth/deflation/v1/params.proto";
import "gogoproto/gogo.proto";

option go_package = "github.com/earth-network/earth/x/deflation/types";

// Msg defines the Msg service.
service Msg {
  option (cosmos.msg.v1.service) = true;

  // UpdateParams defines a (governance) operation for updating the module
  // parameters. The authority defaults to the x/gov module account.
  rpc UpdateParams(MsgUpdateParams) returns (MsgUpdateParamsResponse);

  // SetAllocations defines the SetAllocations RPC.
  rpc SetAllocations(MsgSetAllocations) returns (MsgSetAllocationsResponse);

  // ClaimAllocation defines the ClaimAllocation RPC.
  rpc ClaimAllocation(MsgClaimAllocation) returns (MsgClaimAllocationResponse);

  // AddIntegratedOption adds an INTEGRATED allocation option (governance-gated).
  rpc AddIntegratedOption(MsgAddIntegratedOption) returns (MsgAddIntegratedOptionResponse);

  // AddAddressOption adds an ADDRESS allocation option (permissionless, fee-gated).
  rpc AddAddressOption(MsgAddAddressOption) returns (MsgAddAddressOptionResponse);

  // ResetAllocations clears every allocation vote (governance-gated).
  rpc ResetAllocations(MsgResetAllocations) returns (MsgResetAllocationsResponse);
}

// MsgUpdateParams is the Msg/UpdateParams request type.
message MsgUpdateParams {
  option (cosmos.msg.v1.signer) = "authority";
  option (amino.name) = "earth/x/deflation/MsgUpdateParams";

  // authority is the address that controls the module (defaults to x/gov unless overwritten).
  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];

  // params defines the module parameters to update.

  // NOTE: All parameters must be supplied.
  Params params = 2 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
}

// MsgUpdateParamsResponse defines the response structure for executing a
// MsgUpdateParams message.
message MsgUpdateParamsResponse {}

// MsgSetAllocations sets the sender's stake-weighted split across allocation
// options. The percentages must sum to 100.
message MsgSetAllocations {
  option (cosmos.msg.v1.signer) = "creator";
  string creator = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  repeated AllocationWeight percentages = 2 [(gogoproto.nullable) = false];
}

// MsgSetAllocationsResponse defines the MsgSetAllocationsResponse message.
message MsgSetAllocationsResponse {}

// MsgClaimAllocation defines the MsgClaimAllocation message.
message MsgClaimAllocation {
  option (cosmos.msg.v1.signer) = "creator";
  string creator = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  uint64 option_id = 2;
}

// MsgClaimAllocationResponse defines the MsgClaimAllocationResponse message.
message MsgClaimAllocationResponse {}

// MsgAddIntegratedOption adds an INTEGRATED allocation option, resolved every
// block by the protocol handler named by `handler`. Governance-gated (authority
// defaults to the x/gov module account); the handler must be registered on-chain.
message MsgAddIntegratedOption {
  option (cosmos.msg.v1.signer) = "authority";
  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string description = 2;
  string handler = 3;
}

// MsgAddIntegratedOptionResponse returns the new option id.
message MsgAddIntegratedOptionResponse {
  uint64 id = 1;
}

// MsgAddAddressOption adds an ADDRESS allocation option payable to `recipient`.
// Permissionless: any account may add one by paying params.address_option_fee
// (burned).
message MsgAddAddressOption {
  option (cosmos.msg.v1.signer) = "submitter";
  string submitter = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string description = 2;
  string recipient = 3 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  // claimer optionally restricts who may trigger the claim. Leave empty to let
  // anyone trigger it; the payout goes to `recipient` regardless.
  string claimer = 4 [(cosmos_proto.scalar) = "cosmos.AddressString"];
}

// MsgAddAddressOptionResponse returns the new option id.
message MsgAddAddressOptionResponse {
  uint64 id = 1;
}

// MsgResetAllocations clears every stake-weighted allocation vote, so the
// emission stream is only directed by stakers who show up and vote again.
//
// Votes are cast once and then persist indefinitely, so over time the split
// reflects whoever was active when they last voted rather than who is active
// now. This retires the whole slate at once.
//
// Options survive along with any ERTH they have already accrued, so no recipient
// loses a claimable balance and nobody re-pays the address-option fee. Staked
// balances are untouched. Until voters return, the stream simply accrues to
// nothing.
message MsgResetAllocations {
  option (cosmos.msg.v1.signer) = "authority";
  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
}

// MsgResetAllocationsResponse reports the epoch now in force.
message MsgResetAllocationsResponse {
  uint64 epoch = 1;
}
