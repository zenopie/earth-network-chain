syntax = "proto3";
package earth.pki.module.v1;

import "cosmos/app/v1alpha1/module.proto";

option go_package = "github.com/earth-network/earth/x/pki/types";

// Module is the config object for the x/pki (passport PKI / DSC registry) module.
message Module {
  option (cosmos.app.v1alpha1.module) = {go_import: "github.com/earth-network/earth/x/pki"};

  // authority defines the custom module authority. Defaults to x/gov if unset.
  string authority = 1;
}
