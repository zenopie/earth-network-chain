syntax = "proto3";
package earth.assembly.v1;

import "cosmos/msg/v1/msg.proto";
import "earth/assembly/v1/assembly.proto";
import "earth/personhood/v1/registration.proto";
import "earth/shielded/v1/shielded.proto";
import "gogoproto/gogo.proto";

option go_package = "github.com/earth-network/earth/x/assembly/types";

// Msg is the assembly: the chamber where weight is a person rather than a coin.
//
// Every message here is a private msg (unsigned, alone in its tx, its fee paid
// from the shielded pool by the earth.shielded Bundle it embeds) carrying a
// membership proof against x/personhood's identity tree. Who voted is never
// known; that the same person voted twice in one ballot is, because they
// present the same nullifier, and the later vote replaces the earlier. There is
// no UpdateParams: the assembly exists to check stake-weighted governance, so
// nothing about it is a governance parameter.
//
// fee is a fee bundle: its only balance is the uerth fee. Each msg's sighash
// is zk/orchard.Sighash(type URL, chain id, tx fields (memo, timeout_height,
// gas_limit), 1, digest(fee), fields...), which
// every action proof and the binding signature bind and which the membership
// proof binds as its signal; the fields are listed on each msg.
service Msg {
  option (cosmos.msg.v1.service) = true;

  // VoteProposal casts a vote on an x/gov proposal that is in its voting
  // period. Two thirds of the votes cast here are required before x/gov's own
  // result is allowed to take effect.
  rpc VoteProposal(MsgVoteProposal) returns (MsgVoteProposalResponse);

  // ProposeRemoval opens a ballot to remove a live groundworks allocation
  // option.
  rpc ProposeRemoval(MsgProposeRemoval) returns (MsgProposeRemovalResponse);

  // VoteRemoval casts a vote on an open removal ballot.
  rpc VoteRemoval(MsgVoteRemoval) returns (MsgVoteRemovalResponse);
}

// MsgVoteProposal votes on an x/gov proposal as a human.
//
// This is not x/gov's MsgVote and cannot be. That message is weighted by bonded
// stake, and the votes it records are deleted by the tally that counts them.
//
// membership is proven with scope zk/privacy.ProposalScope(proposal_id, round),
// excluded_dsc / excluded_country the proposal's subjects (a single revoked
// Document Signer, or the one country all its revocations belong to; see
// ProposalSubjects) and max_activation the round's opening time minus one day
// (86400, the largest identity root window, whatever the parameter): a
// person who switched identity after the round opened cannot vote in it
// again. Query BallotInputs for the round's values.
//
// sighash fields: proposal_id, option.
message MsgVoteProposal {
  earth.shielded.v1.Bundle fee = 1 [(gogoproto.nullable) = false];
  earth.personhood.v1.Membership membership = 2 [(gogoproto.nullable) = false];
  uint64 proposal_id = 3;
  VoteOption option = 4;
}

// MsgVoteProposalResponse defines the MsgVoteProposal response type.
message MsgVoteProposalResponse {}

// MsgProposeRemoval opens a ballot to remove groundworks option option_id.
//
// No deposit. A deposit would price this in ERTH, and a chamber whose whole
// premise is that holdings do not count cannot charge for entry in holdings. The
// brake is instead structural: one open ballot per option, and a live
// registration to open it.
//
// membership is proven with scope zk/privacy.ProposeRemovalScope(option_id,
// today's UTC day), excluded_dsc and excluded_country 0 and max_activation the start of today
// (UTC) minus one day (86400). Its nullifier is not recorded.
//
// sighash fields: option_id.
message MsgProposeRemoval {
  earth.shielded.v1.Bundle fee = 1 [(gogoproto.nullable) = false];
  earth.personhood.v1.Membership membership = 2 [(gogoproto.nullable) = false];
  uint64 option_id = 3;
}

// MsgProposeRemovalResponse reports the new ballot and when it closes.
message MsgProposeRemovalResponse {
  int64 closes_at = 1;
  uint64 ballot_id = 2;
}

// MsgVoteRemoval votes on an open removal ballot.
//
// membership is proven with scope zk/privacy.RemovalScope(ballot_id),
// excluded_dsc and excluded_country 0 and max_activation the ballot's opening time minus
// one day (86400).
//
// sighash fields: option_id, option.
message MsgVoteRemoval {
  earth.shielded.v1.Bundle fee = 1 [(gogoproto.nullable) = false];
  earth.personhood.v1.Membership membership = 2 [(gogoproto.nullable) = false];
  uint64 option_id = 3;
  VoteOption option = 4;
}

// MsgVoteRemovalResponse defines the MsgVoteRemoval response type.
message MsgVoteRemovalResponse {}
