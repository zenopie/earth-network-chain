syntax = "proto3";
package earth.assembly.v1;

import "gogoproto/gogo.proto";

option go_package = "github.com/earth-network/earth/x/assembly/types";

// VoteOption is one human's position on a ballot.
//
// There is deliberately no abstain. Approval is two thirds of the votes cast, so
// an abstention and a non-vote come to exactly the same arithmetic; offering
// both would only invite a voter to think they had done something different.
enum VoteOption {
  option (gogoproto.goproto_enum_prefix) = false;

  // VOTE_OPTION_UNSPECIFIED is an invalid default; every vote must name a side.
  VOTE_OPTION_UNSPECIFIED = 0;
  VOTE_OPTION_YES = 1;
  VOTE_OPTION_NO = 2;
}

// Tally is a ballot's running count. Votes are people, not weight: the whole
// point of this chamber is that there is no number attached to a human.
message Tally {
  uint64 yes = 1;
  uint64 no = 2;
}

// RemovalBallot is an open vote to remove one groundworks allocation option.
//
// The stream is not recorded because there is only one it can be. Removal is the
// chamber's single affirmative power and it reaches the groundworks slate alone;
// the caretaker slate is directed by these same humans voting continuously, and
// has no need of a second instrument pointed at it.
message RemovalBallot {
  uint64 option_id = 1;
  // proposer was the opening account. Ballots are opened anonymously now.
  reserved 2;
  reserved "proposer";
  // closes_at is when voting ends, in unix seconds. The EndBlocker resolves the
  // ballot at the first block at or after it.
  int64 closes_at = 3;
  Tally tally = 4 [(gogoproto.nullable) = false];
  // opened_at is when the ballot opened, in unix seconds. Membership proofs
  // for it must come from identities activated at least an identity root
  // window before.
  int64 opened_at = 5;
  // ballot_id is the ballot's id, which its scope is derived from.
  uint64 ballot_id = 6;
}

// ProposalRound is a proposal's current round of human voting when it is not
// the first: after the chamber demotes an expedited proposal, the regular
// round is a new ballot with its own scope and opening time.
message ProposalRound {
  uint64 round = 1;
  int64 opened_at = 2;
}

// ProposalSubjects is who a proposal is about, fixed when it enters voting:
// the registrations its revocations would remove, which may not vote on it.
// Exactly one of excluded_dsc / excluded_country is set, or neither, or
// refusal says why the proposal cannot be voted on. See x/assembly
// keeper/subjects.go.
message ProposalSubjects {
  // excluded_dsc is the one Document Signer (Poseidon2 commitment) the
  // proposal revokes, when that is all it revokes.
  bytes excluded_dsc = 1;
  // excluded_country is the ISO 3166-1 alpha-2 code of the one country every
  // revocation in the proposal belongs to.
  string excluded_country = 2;
  // refusal is set when the subjects cannot be excluded with one proof (they
  // span countries, or one is of unknown country among several): no vote can
  // be cast and the proposal must be split.
  string refusal = 3;
}
