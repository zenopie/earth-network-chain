syntax = "proto3";
package earth.assembly.v1;

import "cosmos_proto/cosmos.proto";
import "gogoproto/gogo.proto";

option go_package = "github.com/earth-network/earth/x/assembly/types";

// VoteOption is one human's position on a ballot.
//
// There is deliberately no abstain. Approval is two thirds of the votes cast, so
// an abstention and a non-vote come to exactly the same arithmetic; offering
// both would only invite a voter to think they had done something different.
enum VoteOption {
  option (gogoproto.goproto_enum_prefix) = false;

  // VOTE_OPTION_UNSPECIFIED is an invalid default; every vote must name a side.
  VOTE_OPTION_UNSPECIFIED = 0;
  VOTE_OPTION_YES = 1;
  VOTE_OPTION_NO = 2;
}

// Tally is a ballot's running count. Votes are people, not weight: the whole
// point of this chamber is that there is no number attached to a human.
message Tally {
  uint64 yes = 1;
  uint64 no = 2;
}

// RemovalBallot is an open vote to remove one groundworks allocation option.
//
// The stream is not recorded because there is only one it can be. Removal is the
// chamber's single affirmative power and it reaches the groundworks slate alone;
// the caretaker slate is directed by these same humans voting continuously, and
// has no need of a second instrument pointed at it.
message RemovalBallot {
  uint64 option_id = 1;
  string proposer = 2 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  // closes_at is when voting ends, in unix seconds. The EndBlocker resolves the
  // ballot at the first block at or after it.
  int64 closes_at = 3;
  Tally tally = 4 [(gogoproto.nullable) = false];
}
