syntax = "proto3";
package earth.assembly.v1;

import "earth/assembly/v1/assembly.proto";
import "gogoproto/gogo.proto";
import "google/api/annotations.proto";

option go_package = "github.com/earth-network/earth/x/assembly/types";

// Query defines the gRPC querier service.
service Query {
  // ProposalTally returns the human tally on an x/gov proposal, and whether it
  // currently clears the two-thirds bar.
  rpc ProposalTally(QueryProposalTallyRequest) returns (QueryProposalTallyResponse) {
    option (google.api.http).get = "/earth/assembly/v1/proposal_tally/{proposal_id}";
  }

  // RemovalBallots lists every open removal ballot.
  rpc RemovalBallots(QueryRemovalBallotsRequest) returns (QueryRemovalBallotsResponse) {
    option (google.api.http).get = "/earth/assembly/v1/removal_ballots";
  }

  // BallotInputs returns the membership public inputs a vote on a proposal's
  // current round (proposal_id set) or on an option's open removal ballot
  // (option_id set) must be proven against.
  rpc BallotInputs(QueryBallotInputsRequest) returns (QueryBallotInputsResponse) {
    option (google.api.http).get = "/earth/assembly/v1/ballot_inputs";
  }
}

message QueryBallotInputsRequest {
  uint64 proposal_id = 1;
  uint64 option_id = 2;
}

message QueryBallotInputsResponse {
  bytes scope = 1;
  bytes excluded_dsc = 2;
  uint64 max_activation = 3;
  uint64 round = 4;
  uint64 ballot_id = 5;
  // excluded_country is zk/privacy.CountryField of the excluded country, 32
  // bytes (zero for none).
  bytes excluded_country = 6;
  // max_predecessor is the membership proof's max_predecessor (the
  // double-vote bound: an identity that replaced another after the ballot
  // opened, less the activation margin, may not vote). max_activation is
  // NoBound (2^63 - 1) for ballots.
  uint64 max_predecessor = 7;
}

message QueryProposalTallyRequest {
  uint64 proposal_id = 1;
}

message QueryProposalTallyResponse {
  Tally tally = 1 [(gogoproto.nullable) = false];
  // approved reports whether the tally as it stands clears two thirds. A
  // proposal with no human votes is not approved — silence is not assent here.
  bool approved = 2;
}

message QueryRemovalBallotsRequest {}

message QueryRemovalBallotsResponse {
  repeated RemovalBallot ballots = 1 [(gogoproto.nullable) = false];
}
