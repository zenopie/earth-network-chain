syntax = "proto3";

package earth.personhood.v1;

import "amino/amino.proto";
import "cosmos/msg/v1/msg.proto";
import "cosmos_proto/cosmos.proto";
import "earth/personhood/v1/allocation.proto";
import "earth/personhood/v1/params.proto";
import "gogoproto/gogo.proto";

option go_package = "github.com/earth-network/earth/x/personhood/types";

// Msg defines the Msg service.
service Msg {
  option (cosmos.msg.v1.service) = true;

  // UpdateParams defines a (governance) operation for updating the module
  // parameters. The authority defaults to the x/gov module account.
  rpc UpdateParams(MsgUpdateParams) returns (MsgUpdateParamsResponse);

  // Register defines the Register RPC.
  rpc Register(MsgRegister) returns (MsgRegisterResponse);

  // ClaimAnml defines the ClaimAnml RPC.
  rpc ClaimAnml(MsgClaimAnml) returns (MsgClaimAnmlResponse);

  // SetDemocraticAllocations defines the SetDemocraticAllocations RPC.
  rpc SetDemocraticAllocations(MsgSetDemocraticAllocations) returns (MsgSetDemocraticAllocationsResponse);

  // ClaimDemocraticAllocation defines the ClaimDemocraticAllocation RPC.
  rpc ClaimDemocraticAllocation(MsgClaimDemocraticAllocation) returns (MsgClaimDemocraticAllocationResponse);

  // AddIntegratedOption adds an INTEGRATED democratic option (governance-gated).
  rpc AddIntegratedOption(MsgAddIntegratedOption) returns (MsgAddIntegratedOptionResponse);

  // AddAddressOption adds an ADDRESS democratic option (permissionless, fee-gated).
  rpc AddAddressOption(MsgAddAddressOption) returns (MsgAddAddressOptionResponse);

  // ResetDemocraticAllocations clears every democratic vote (governance-gated).
  rpc ResetDemocraticAllocations(MsgResetDemocraticAllocations) returns (MsgResetDemocraticAllocationsResponse);
}
// MsgUpdateParams is the Msg/UpdateParams request type.
message MsgUpdateParams {
  option (cosmos.msg.v1.signer) = "authority";
  option (amino.name) = "earth/x/personhood/MsgUpdateParams";

  // authority is the address that controls the module (defaults to x/gov unless overwritten).
  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];

  // params defines the module parameters to update.

  // NOTE: All parameters must be supplied.
  Params params = 2 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
}

// MsgUpdateParamsResponse defines the response structure for executing a
// MsgUpdateParams message.
message MsgUpdateParamsResponse {}

// MsgRegister registers the signer as a unique human. proof is a Barretenberg
// UltraHonk (bb v5.0.0) proof and public_signals are its public signals as decimal
// strings; their positions (nullifier/dsc_key/current_date) are governance params.
// For the lean_poa circuit the order is [dsc_key, current_date, nullifier].
// signature_algorithm selects the verifying key. The chain verifies the proof,
// verifies dsc_der against the CSCA trust store and binds it to the proof's
// dsc_key, pins current_date to block time, and dedups on the nullifier.
message MsgRegister {
  option (cosmos.msg.v1.signer) = "creator";
  string creator = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  // proof is the Barretenberg UltraHonk proof bytes (bb v5.0.0, poseidon2 flavor).
  bytes proof = 2;
  // public_signals are the circuit public signals as decimal strings; positions
  // are governance-configured (nullifier_index / dsc_key_index / current_date_index).
  repeated string public_signals = 3;
  // affiliate is the optional referrer address (must be a registered human).
  string affiliate = 4 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  // signature_algorithm selects the verifying key (e.g. "rsa_65537_sha256").
  string signature_algorithm = 5;
  // dsc_der is the DER-encoded Document Signer certificate that signed the
  // passport's SOD. The chain verifies it chains to a trusted CSCA and is not
  // revoked, then recomputes its commitment and requires the proof's public
  // input to match — so the proof is bound to this specific signer.
  bytes dsc_der = 6;
}

// MsgRegisterResponse returns the registration reward paid to the registree.
message MsgRegisterResponse {
  string reward = 1 [
    (cosmos_proto.scalar) = "cosmos.Int",
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false
  ];
}

// MsgClaimAnml defines the MsgClaimAnml message.
message MsgClaimAnml {
  option (cosmos.msg.v1.signer) = "creator";
  string creator = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
}

// MsgClaimAnmlResponse defines the MsgClaimAnmlResponse message.
message MsgClaimAnmlResponse {}

// MsgSetDemocraticAllocations sets the registered signer's one-human-one-vote
// split across democratic options (percentages must sum to 100, or be empty to
// clear).
message MsgSetDemocraticAllocations {
  option (cosmos.msg.v1.signer) = "creator";
  string creator = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  repeated DemocraticWeight percentages = 2 [(gogoproto.nullable) = false];
}

// MsgSetDemocraticAllocationsResponse defines the MsgSetDemocraticAllocationsResponse message.
message MsgSetDemocraticAllocationsResponse {}

// MsgClaimDemocraticAllocation defines the MsgClaimDemocraticAllocation message.
message MsgClaimDemocraticAllocation {
  option (cosmos.msg.v1.signer) = "creator";
  string creator = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  uint64 option_id = 2;
}

// MsgClaimDemocraticAllocationResponse defines the MsgClaimDemocraticAllocationResponse message.
message MsgClaimDemocraticAllocationResponse {}

// MsgAddIntegratedOption adds an INTEGRATED democratic option, resolved by the
// protocol handler named by `handler`. Governance-gated.
message MsgAddIntegratedOption {
  option (cosmos.msg.v1.signer) = "authority";
  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string description = 2;
  string handler = 3;
}
message MsgAddIntegratedOptionResponse {
  uint64 id = 1;
}

// MsgAddAddressOption adds a claim-based ADDRESS democratic option, payable to
// `recipient`. Permissionless: any account may add one by burning
// params.address_option_fee.
message MsgAddAddressOption {
  option (cosmos.msg.v1.signer) = "submitter";
  string submitter = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string description = 2;
  string recipient = 3 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  // claimer optionally restricts who may trigger the claim. Leave empty to let
  // anyone trigger it; the payout goes to `recipient` regardless.
  string claimer = 4 [(cosmos_proto.scalar) = "cosmos.AddressString"];
}
message MsgAddAddressOptionResponse {
  uint64 id = 1;
}

// MsgResetDemocraticAllocations clears every democratic vote, so the emission
// stream is only directed by humans who show up and vote again.
//
// Votes are cast once and then persist indefinitely, so over time the split
// reflects whoever was active when they last voted rather than who is active
// now. This retires the whole slate at once.
//
// It does not touch registrations: nobody loses their verified-human status or
// has to re-prove personhood, they only have to re-express a preference. Options
// survive too, along with any ERTH they have already accrued, so no recipient
// loses a claimable balance and nobody re-pays the address-option fee. Until
// voters return, the stream simply accrues to nothing.
message MsgResetDemocraticAllocations {
  option (cosmos.msg.v1.signer) = "authority";
  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
}

// MsgResetDemocraticAllocationsResponse reports the epoch now in force.
message MsgResetDemocraticAllocationsResponse {
  uint64 epoch = 1;
}
