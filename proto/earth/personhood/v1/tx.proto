syntax = "proto3";

package earth.personhood.v1;

import "amino/amino.proto";
import "cosmos/msg/v1/msg.proto";
import "cosmos_proto/cosmos.proto";
import "earth/allocation/v1/allocation.proto";
import "earth/personhood/v1/params.proto";
import "earth/personhood/v1/registration.proto";
import "earth/shielded/v1/shielded.proto";
import "gogoproto/gogo.proto";

option go_package = "github.com/earth-network/earth/x/personhood/types";

// Msg defines the Msg service.
//
// Register, ClaimAnml, SetCaretaker and BindReferrer are private msgs:
// unsigned, carried
// alone in a tx, their fee paid from the shielded pool by the earth.shielded
// Bundle each embeds as `fee` (see x/shielded PrivateMsg), whose only balance
// is the uerth fee. Their sighash is zk/orchard.Sighash(type URL, chain id,
// tx fields (memo, timeout_height, gas_limit), 1, digest(fee), fields...),
// which every action proof and the binding signature
// bind, and which a membership proof binds as its signal. The fields are
// listed on each msg.
service Msg {
  option (cosmos.msg.v1.service) = true;

  // UpdateParams defines a (governance) operation for updating the module
  // parameters. The authority defaults to the x/gov module account.
  rpc UpdateParams(MsgUpdateParams) returns (MsgUpdateParamsResponse);

  // Register registers a passport and writes its holder's identity leaf.
  rpc Register(MsgRegister) returns (MsgRegisterResponse);

  // ClaimAnml mints a registered human's daily ANML to a note.
  rpc ClaimAnml(MsgClaimAnml) returns (MsgClaimAnmlResponse);

  // SetCaretaker casts or refreshes a registered human's caretaker split.
  rpc SetCaretaker(MsgSetCaretaker) returns (MsgSetCaretakerResponse);

  // BindReferrer names (or clears) the address a registered human is paid
  // referral rewards at.
  rpc BindReferrer(MsgBindReferrer) returns (MsgBindReferrerResponse);
}

// MsgUpdateParams is the Msg/UpdateParams request type.
message MsgUpdateParams {
  option (cosmos.msg.v1.signer) = "authority";
  option (amino.name) = "earth/x/personhood/MsgUpdateParams";

  // authority is the address that controls the module (defaults to x/gov unless overwritten).
  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];

  // params defines the module parameters to update.

  // NOTE: All parameters must be supplied.
  Params params = 2 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
}

// MsgUpdateParamsResponse defines the response structure for executing a
// MsgUpdateParams message.
message MsgUpdateParamsResponse {}

// MsgRegister registers a passport. Private: unsigned, its fee paid by fee.
//
// proof is a passport circuit's UltraHonk proof and public_signals its public
// inputs as decimal strings (positions are params). The chain verifies it,
// verifies dsc_der against the CSCA trust store and binds it to the proof's
// dsc_key, pins current_date to block time, dedups on the passport nullifier,
// and requires the proof's `address` input to equal
// zk/privacy.RegistrationBinding =
//   H(TAG_REG, idc, pc_anml, Bytes(ciphertext_anml), pc_erth,
//     Bytes(ciphertext_erth), affiliate)
// with affiliate = Bytes(the affiliate's address bytes), 0 when none.
//
// A new registration (or one re-entering after its last lapsed) appends the
// leaf, mints 1 ANML to pc_anml and the registrant's half of the reward to
// pc_erth, and pays the referrer's half in transparent ERTH to affiliate,
// which must hold a live referrer binding (MsgBindReferrer). A live
// registration is a switch: the old leaf is zeroed and the new one appended,
// and nothing is paid (affiliate is then not checked). A switch to the idc
// the live registration already holds is refused (a replay).
//
// sighash fields: idc, pc_anml, Bytes(ciphertext_anml), pc_erth,
// Bytes(ciphertext_erth), affiliate (as in the binding),
// Bytes(signature_algorithm), then every public signal in order. The passport
// proof binds the identity, pcs and ciphertexts through its address input;
// the sighash binds the rest to the fee bundle.
message MsgRegister {
  earth.shielded.v1.Bundle fee = 1 [(gogoproto.nullable) = false];
  // proof is the Barretenberg UltraHonk proof bytes (bb v5.0.0).
  bytes proof = 2;
  // public_signals are the circuit public inputs as decimal strings.
  repeated string public_signals = 3;
  // signature_algorithm selects the verifying key (e.g. "lean_poa").
  string signature_algorithm = 4;
  // dsc_der is the DER-encoded Document Signer certificate.
  bytes dsc_der = 5;
  // idc is the identity commitment H(TAG_ID, id_secret), 32 bytes.
  bytes idc = 6;
  // pc_anml receives the registration's ANML note.
  bytes pc_anml = 7;
  // ciphertext_anml / ciphertext_erth: each note's amount-blind v2
  // ciphertext (zk/privacy.EncryptBlindNote), exactly 177 bytes, required.
  bytes ciphertext_anml = 8;
  // pc_erth receives the registrant's half of the registration reward.
  bytes pc_erth = 9;
  bytes ciphertext_erth = 10;
  // affiliate is the referrer's address (bech32), empty for none. It must
  // hold a live referrer binding, and receives the referrer's half of the
  // reward in transparent ERTH.
  string affiliate = 13 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  // affiliate_pc / affiliate_ciphertext: a private referral note, replaced by
  // the public affiliate address.
  reserved 11, 12;
  reserved "affiliate_pc", "affiliate_ciphertext";
}

// MsgRegisterResponse returns what the registration did.
message MsgRegisterResponse {
  // reward is the ERTH minted to pc_erth; zero on a switch.
  string reward = 1 [
    (cosmos_proto.scalar) = "cosmos.Int",
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false
  ];
  // switched is true when this moved a live registration to a new identity.
  bool switched = 2;
  // leaf_index is the new identity leaf's position.
  uint64 leaf_index = 3;
}

// MsgClaimAnml mints 1 ANML to pc, once per person per UTC day.
//
// membership is proven with scope zk/privacy.ClaimScope(day), excluded_dsc and
// excluded_country 0
// and max_activation the start of the previous UTC day. day must be today.
//
// sighash fields: day, pc, Bytes(ciphertext).
message MsgClaimAnml {
  earth.shielded.v1.Bundle fee = 1 [(gogoproto.nullable) = false];
  Membership membership = 2 [(gogoproto.nullable) = false];
  uint64 day = 3;
  bytes pc = 4;
  // ciphertext is the ANML note's amount-blind v2 ciphertext, 177 bytes.
  bytes ciphertext = 5;
}

// MsgClaimAnmlResponse returns the ANML note's position.
message MsgClaimAnmlResponse {
  uint64 position = 1;
}

// MsgSetCaretaker casts, replaces or clears (empty percentages) the prover's
// caretaker split. The split is public; who cast it is not.
//
// membership is proven with scope zk/privacy.CaretakerScope(), excluded_dsc and
// excluded_country 0
// and max_activation this msg's max_activation, which must be at most now -
// caretaker_vote_seconds (or a held, longer one after governance lowered it)
// - 86400 (one day, the largest identity root window). The wallet names the
// bound (rounded down, say to the hour, so it says nothing about when the tx
// was made) because the chain's own changes every block and a proof must be
// made before its block is known. The split counts until now +
// caretaker_vote_seconds; the wallet refreshes it before then.
//
// sighash fields: for each entry, option_id then percent.
message MsgSetCaretaker {
  earth.shielded.v1.Bundle fee = 1 [(gogoproto.nullable) = false];
  Membership membership = 2 [(gogoproto.nullable) = false];
  repeated earth.allocation.v1.AllocationWeight percentages = 3 [(gogoproto.nullable) = false];
  // max_activation is the membership proof's max_activation (unix seconds).
  uint64 max_activation = 4;
}

// MsgSetCaretakerResponse reports when the split lapses (unix seconds), 0 when
// it was cleared.
message MsgSetCaretakerResponse {
  int64 expires_at = 1;
}

// MsgBindReferrer binds address as the prover's referral address, or clears
// the binding (empty address). Referrals are public: a registration naming
// address pays the referrer's half of its reward there, in transparent ERTH.
// Who bound it is not public; that a live registration did, is.
//
// membership is proven with scope zk/privacy.ReferrerScope(), excluded_dsc
// and excluded_country 0 and max_activation this msg's max_activation, which
// must be at most now - caretaker_vote_seconds (or a held, longer one) - one
// day (the caretaker rule: a switched-to identity cannot hold a binding beside
// its predecessor's). The binding lasts caretaker_vote_seconds; the wallet
// refreshes it. Rebinding under the same nullifier moves it to the new
// address. An address bound under another live nullifier is refused.
//
// Binding an address takes its owner's consent, so nobody can squat an
// address they do not control: referrer_pub_key is the address's 33-byte
// compressed secp256k1 public key (the address must be its RIPEMD160(SHA256))
// and referrer_signature its 64-byte r||s (low-S) ECDSA signature over
// SHA-256 of the consent bytes (what cosmos-sdk's secp256k1 PrivKey.Sign
// produces for them):
//
//   "earth.referrer.consent.v1" || u8 len(chain_id) || chain_id
//     || membership.nullifier (32 bytes) || address (raw bytes)
//
// Both are empty when clearing (empty address). They are not sighash fields:
// the consent itself binds the nullifier and the address.
//
// sighash fields: Bytes(address bytes).
message MsgBindReferrer {
  earth.shielded.v1.Bundle fee = 1 [(gogoproto.nullable) = false];
  Membership membership = 2 [(gogoproto.nullable) = false];
  string address = 3 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  // max_activation is the membership proof's max_activation (unix seconds).
  uint64 max_activation = 4;
  // referrer_pub_key and referrer_signature: the address owner's consent
  // (see above).
  bytes referrer_pub_key = 5;
  bytes referrer_signature = 6;
}

// MsgBindReferrerResponse reports when the binding lapses (unix seconds), 0
// when it was cleared.
message MsgBindReferrerResponse {
  int64 expires_at = 1;
}
