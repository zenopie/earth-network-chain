syntax = "proto3";
package earth.personhood.v1;

import "cosmos_proto/cosmos.proto";

option go_package = "github.com/earth-network/earth/x/personhood/types";

// Registration is one registered passport: its dedup key, and where its
// holder's identity sits in the identity tree. It names no account and no
// note; nothing here links the passport to what its holder later does.
message Registration {
  // nullifier is the passport nullifier the registration proof outputs, the
  // public dedup key. Derived from passport data (issuer, document number,
  // date of birth), so it identifies the passport to its issuer: that is why
  // nothing the holder does after registering is keyed by it.
  bytes nullifier = 1;
  // leaf_index is the identity tree position of this registration's leaf
  // H(TAG_LEAF, idc, dsc_key, country, activated_at). Zeroed when the registration
  // expires, its signer is revoked, or its holder switches.
  uint64 leaf_index = 2;
  // registered_at is the unix time (seconds) of the registration; it expires
  // registration_validity_seconds later.
  int64 registered_at = 3;
  // activated_at is the unix time the leaf was written, which the leaf
  // commits to. Membership proofs bound it from above (see Params) so a
  // switch to a new identity secret cannot act again where the old one did.
  int64 activated_at = 4;
  // dsc_key is the Poseidon2 commitment to the Document Signer that produced
  // the registration proof, which the leaf also commits to.
  bytes dsc_key = 5;
  // country is the ISO 3166-1 alpha-2 of the CSCA that verified the DSC, or
  // "" when it names none. The leaf commits to zk/privacy.CountryField of it
  // (0 for unknown), so an assembly vote can exclude a country's
  // registrations.
  string country = 6;
  // idc is the identity commitment H(TAG_ID, id_secret) the leaf was made
  // from. Public in MsgRegister already; kept so genesis can rebuild the tree.
  bytes idc = 7;
  // predecessor_at is the time of the switch or re-entry that created this
  // registration's leaf (unix seconds), 0 for a passport never registered
  // before. The leaf commits to it, and a membership proof bounds it
  // (max_predecessor): an identity that replaced another waits, per scope,
  // until anything its predecessor could hold there has lapsed; a fresh one
  // does not.
  int64 predecessor_at = 8;
}

// RateCounter is a self-resetting daily counter, used to bound how many
// registrations one Document Signer or one issuing country may produce in a day.
//
// Stored as a (day, count) pair rather than as a row per day so it costs one
// entry per subject no matter how long the chain runs: when the day rolls the
// count resets in place, and there is nothing to prune. The cost of that is
// that history is not kept — only the current day, and the one before it.
message RateCounter {
  // day is the unix day (block time / 86400) the count belongs to.
  uint64 day = 1;
  // count is how many registrations have landed during that day.
  uint64 count = 2;
  // previous_count is the completed previous day's total.
  //
  // Only the network-wide counter uses it, and it is what the per-signer caps
  // scale against. Scaling against the current day instead would be circular:
  // the day starts at zero, so every cap would start the day at its floor and
  // widen as registrations arrived — tightest exactly when a burst begins.
  uint64 previous_count = 3;
}

// IdentityRoot is one recorded identity-tree root. A root becomes a valid
// anchor for membership proofs at the end of the block that produced it and
// stays one for identity_root_window_seconds (the latest root always).
message IdentityRoot {
  bytes root = 1;
  int64 height = 2;
  int64 time = 3;
  uint64 tree_size = 4;
}

// Membership is an anonymous proof that its prover holds a live identity-tree
// leaf (membership circuit, bb v5.0.0 UltraHonk). The chain supplies the other
// public inputs itself: scope, signal, excluded_dsc, excluded_country and
// max_activation are fixed by the msg carrying it.
message Membership {
  bytes proof = 1;
  // root is the identity-tree anchor the proof was made against.
  bytes root = 2;
  // nullifier is H(TAG_SN, id_secret, scope): one per person per scope.
  bytes nullifier = 3;
}

// ClaimNullifier records that the holder of nullifier claimed on day.
message ClaimNullifier {
  uint64 day = 1;
  bytes nullifier = 2;
}

// CaretakerVote is a live caretaker split's lease: the split itself is the
// x/allocation voter filed under the same nullifier.
message CaretakerVote {
  bytes nullifier = 1;
  int64 expires_at = 2;
}

// Handle is a registered human's name in the public handle directory: the
// shielded address it resolves to, the handle's binding nullifier (scope
// "handle": one per human), and its lease. Live (it resolves) while
// expires_at is in the future; then, for handle_renewal_seconds, reserved to
// the same nullifier (only its owner may renew it; it does not resolve);
// then released (swept, free for anyone). A change to another handle or an
// explicit release frees it at once.
message Handle {
  string handle = 1;
  // owner_pk (32 bytes, canonical BN254 scalar) and ek_pub (32 bytes,
  // X25519): the shielded address (zk/privacy.ShieldedAddress).
  bytes owner_pk = 2;
  bytes ek_pub = 3;
  bytes nullifier = 4;
  int64 expires_at = 5;
}

// UsedRegistrationBinding is a registration binding (the proof's address
// input: Poseidon2 of idc, the reward notes, their ciphertexts and the
// affiliate) that has been registered, refused for reuse until expires_at.
// A passport proof is public once it lands; without this record anyone could
// replay a holder's earlier registration (A -> B -> A) as a switch back to A
// while its current_date is still inside the skew. expires_at is the proof's
// current_date plus the largest skew governance may set (a year) plus a day,
// past which the date check refuses the proof anyway, whatever the skew.
message UsedRegistrationBinding {
  bytes binding = 1;
  int64 expires_at = 2;
}

// LeaseHold is the lease length (caretaker_vote_seconds) the activation bound
// of MsgSetCaretaker and MsgBindHandle keeps using until `until`, after
// governance lowered it: a lease cast under the old length runs that long,
// and a switched-to identity must not cast one beside its predecessor's.
// Zero when no hold is in force.
message LeaseHold {
  int64 seconds = 1;
  int64 until = 2;
}
