syntax = "proto3";
package earth.personhood.v1;

import "amino/amino.proto";
import "cosmos/base/query/v1beta1/pagination.proto";
import "earth/personhood/v1/params.proto";
import "earth/personhood/v1/registration.proto";
import "gogoproto/gogo.proto";
import "google/api/annotations.proto";

option go_package = "github.com/earth-network/earth/x/personhood/types";

// Query defines the gRPC querier service.
service Query {
  // Parameters queries the parameters of the module.
  rpc Params(QueryParamsRequest) returns (QueryParamsResponse) {
    option (google.api.http).get = "/earth/personhood/v1/params";
  }

  // Registration looks a registration up by its passport nullifier (hex).
  rpc Registration(QueryRegistrationRequest) returns (QueryRegistrationResponse) {
    option (google.api.http).get = "/earth/personhood/v1/registration/{nullifier}";
  }

  // IdentityTree returns the identity tree's size and latest anchor.
  rpc IdentityTree(QueryIdentityTreeRequest) returns (QueryIdentityTreeResponse) {
    option (google.api.http).get = "/earth/personhood/v1/identity_tree";
  }

  // IdentityLeaves returns a range of identity leaves (zero for zeroed ones),
  // for wallets and indexers rebuilding the tree. Ranges only: nothing here
  // asks for "my" leaf.
  rpc IdentityLeaves(QueryIdentityLeavesRequest) returns (QueryIdentityLeavesResponse) {
    option (google.api.http).get = "/earth/personhood/v1/identity_leaves";
  }

  // CaretakerVoterCount is how many caretaker splits currently count.
  rpc CaretakerVoterCount(QueryCaretakerVoterCountRequest) returns (QueryCaretakerVoterCountResponse) {
    option (google.api.http).get = "/earth/personhood/v1/caretaker_voter_count";
  }

  // RegistrationCount returns how many humans are currently registered.
  rpc RegistrationCount(QueryRegistrationCountRequest) returns (QueryRegistrationCountResponse) {
    option (google.api.http).get = "/earth/personhood/v1/registration_count";
  }

  // RegistrationsByDsc counts registrations produced by one Document Signer.
  rpc RegistrationsByDsc(QueryRegistrationsByDscRequest) returns (QueryRegistrationsByDscResponse) {
    option (google.api.http).get = "/earth/personhood/v1/registrations_by_dsc/{dsc_key}";
  }

  // Handle returns one handle's record.
  rpc Handle(QueryHandleRequest) returns (QueryHandleResponse) {
    option (google.api.http).get = "/earth/personhood/v1/handle/{handle}";
  }

  // Handles pages through the whole directory in handle order: a wallet
  // fetches it all rather than asking about the one it pays, so its lookups
  // do not say who pays whom.
  rpc Handles(QueryHandlesRequest) returns (QueryHandlesResponse) {
    option (google.api.http).get = "/earth/personhood/v1/handles";
  }

  // LeaseBounds returns the lease lengths the predecessor bounds use, as the
  // chain enforces them now, and the bounds themselves at this block. A
  // wallet proving a handle claim (or a renewal of a handle that is not
  // live) or a new caretaker split sets max_predecessor below the bound for
  // its scope: floor_hour(block_time - lease_seconds - margin) style
  // rounding computed from these lease lengths, never from Params, which
  // may be shorter (handle_lease_seconds after a cut; the longest ever
  // still bounds handles; a cut caretaker_vote_seconds keeps bounding
  // splits until every lease cast under the old one has lapsed).
  rpc LeaseBounds(QueryLeaseBoundsRequest) returns (QueryLeaseBoundsResponse) {
    option (google.api.http).get = "/earth/personhood/v1/lease_bounds";
  }

  // RegistrationCountries returns the registration count per issuing country.
  rpc RegistrationCountries(QueryRegistrationCountriesRequest) returns (QueryRegistrationCountriesResponse) {
    option (google.api.http).get = "/earth/personhood/v1/registration_countries";
  }
}

// QueryParamsRequest is request type for the Query/Params RPC method.
message QueryParamsRequest {}

// QueryParamsResponse is response type for the Query/Params RPC method.
message QueryParamsResponse {
  // params holds all the parameters of this module.
  Params params = 1 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
}

// QueryLeaseBoundsRequest is the request type for Query/LeaseBounds.
message QueryLeaseBoundsRequest {}

// QueryLeaseBoundsResponse: the effective lease lengths (seconds) and the
// predecessor bounds they give at block_time. A msg's max_predecessor must be
// strictly less than its scope's bound when it lands; the bounds only move
// forward with time, so a value below the bound now stays below it.
message QueryLeaseBoundsResponse {
  // block_time is the time (unix seconds) the bounds are computed at.
  int64 block_time = 1;
  // activation_margin_seconds is the margin both bounds subtract.
  int64 activation_margin_seconds = 2;
  // handle_lease_seconds: the longest handle lease ever in force
  // (max(params.handle_lease_seconds, handle_lease_max)).
  int64 handle_lease_seconds = 3;
  // handle_claim_bound = block_time - handle_lease_seconds -
  // activation_margin_seconds: MsgBindHandle's max_predecessor bound for a
  // claim, or a renewal or change of a handle that is not live.
  int64 handle_claim_bound = 4;
  // caretaker_lease_seconds: params.caretaker_vote_seconds, or a longer
  // lease length governance lowered it from while leases cast under that
  // may still run (lease_hold).
  int64 caretaker_lease_seconds = 5;
  // caretaker_cast_bound = block_time - caretaker_lease_seconds -
  // activation_margin_seconds: MsgSetCaretaker's max_predecessor bound for a
  // new split (one the prover does not hold live).
  int64 caretaker_cast_bound = 6;
  // caretaker_lease_hold_until: when the held longer lease stops counting
  // (0 when none is held).
  int64 caretaker_lease_hold_until = 7;
}

// QueryRegistrationRequest names a passport nullifier, hex-encoded.
message QueryRegistrationRequest {
  string nullifier = 1;
}

// QueryRegistrationResponse returns the registration, if any.
message QueryRegistrationResponse {
  bool registered = 1;
  bool expired = 2;
  Registration registration = 3 [(gogoproto.nullable) = false];
}

message QueryIdentityTreeRequest {}

// QueryIdentityTreeResponse is the tree's size and its latest recorded root.
message QueryIdentityTreeResponse {
  uint64 size = 1;
  bytes latest_root = 2;
  // window_seconds is how long a superseded root stays an anchor.
  uint64 window_seconds = 3;
}

message QueryIdentityLeavesRequest {
  uint64 start = 1;
  // limit is capped at 1000.
  uint64 limit = 2;
}

message QueryIdentityLeavesResponse {
  repeated bytes leaves = 1;
}

message QueryCaretakerVoterCountRequest {}

message QueryCaretakerVoterCountResponse {
  uint64 count = 1;
}

// QueryRegistrationCountRequest requests the live registration headcount.
message QueryRegistrationCountRequest {}

// QueryRegistrationCountResponse returns the live registration headcount. This
// is the denominator of the human emission stream: one vote each.
message QueryRegistrationCountResponse {
  uint64 count = 1;
}

// QueryRegistrationsByDscRequest identifies a Document Signer by the hex-encoded
// dsc_key commitment recorded on its registrations.
message QueryRegistrationsByDscRequest {
  string dsc_key = 1;
}
message QueryRegistrationsByDscResponse {
  uint64 count = 1;
}

// CountryCount is one country's registration total.
message CountryCount {
  string country = 1; // ISO 3166-1 alpha-2, "" for unknown
  uint64 count = 2;
}

message QueryRegistrationCountriesRequest {}
message QueryRegistrationCountriesResponse {
  repeated CountryCount countries = 1 [(gogoproto.nullable) = false];
}

// QueryHandleRequest names a handle.
message QueryHandleRequest {
  string handle = 1;
}

// HandleEntry is a handle as the directory serves it.
message HandleEntry {
  string handle = 1;
  // address is the shielded address (bech32m "erthz1...").
  string address = 2;
  // status: "live" (it resolves: a registration may name it, wallets may
  // pay it), "renewal" (lease ended; reserved to its owner until
  // renewal_until, does not resolve) or "free" (unclaimed or released).
  string status = 3;
  int64 expires_at = 4;
  // renewal_until is expires_at + handle_renewal_seconds.
  int64 renewal_until = 5;
  // owner is the handle-scope nullifier that holds the handle, as 64
  // lowercase hex characters ("" for a handle never claimed). Already
  // public: it is the membership nullifier of the MsgBindHandle that claimed
  // or renewed the handle, or the new_owner of the MsgMoveHandle that moved
  // it here, and the handle events carry it. A wallet compares it with its
  // own handle-scope nullifier to know a handle is its own.
  string owner = 6;
}

// QueryHandleResponse: found (false: free and unclaimed), and the entry.
message QueryHandleResponse {
  bool found = 1;
  HandleEntry handle = 2 [(gogoproto.nullable) = false];
}

// QueryHandlesRequest pages the directory: handles after start (exclusive;
// "" from the first), at most limit (0: 100; at most 1000).
message QueryHandlesRequest {
  string start = 1;
  uint32 limit = 2;
}

// QueryHandlesResponse: the page, and next (the last handle returned, to
// pass as start; "" when the directory is exhausted).
message QueryHandlesResponse {
  repeated HandleEntry handles = 1 [(gogoproto.nullable) = false];
  string next = 2;
}
