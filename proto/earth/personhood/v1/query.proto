syntax = "proto3";
package earth.personhood.v1;

import "amino/amino.proto";
import "cosmos/base/query/v1beta1/pagination.proto";
import "cosmos_proto/cosmos.proto";
import "earth/personhood/v1/allocation.proto";
import "earth/personhood/v1/params.proto";
import "earth/personhood/v1/registration.proto";
import "gogoproto/gogo.proto";
import "google/api/annotations.proto";

option go_package = "github.com/earth-network/earth/x/personhood/types";

// Query defines the gRPC querier service.
service Query {
  // Parameters queries the parameters of the module.
  rpc Params(QueryParamsRequest) returns (QueryParamsResponse) {
    option (google.api.http).get = "/earth-network/earth/personhood/v1/params";
  }

  // Registration queries a wallet's registration status.
  rpc Registration(QueryRegistrationRequest) returns (QueryRegistrationResponse) {
    option (google.api.http).get = "/earth-network/earth/personhood/v1/registration/{address}";
  }

  // DemocraticOptions queries all democratic allocation options.
  rpc DemocraticOptions(QueryDemocraticOptionsRequest) returns (QueryDemocraticOptionsResponse) {
    option (google.api.http).get = "/earth-network/earth/personhood/v1/democratic_options";
  }

  // RegistrationsByDsc counts registrations produced by one Document Signer.
  rpc RegistrationsByDsc(QueryRegistrationsByDscRequest) returns (QueryRegistrationsByDscResponse) {
    option (google.api.http).get = "/earth-network/earth/personhood/v1/registrations_by_dsc/{dsc_key}";
  }

  // RegistrationCountries returns the registration count per issuing country.
  rpc RegistrationCountries(QueryRegistrationCountriesRequest) returns (QueryRegistrationCountriesResponse) {
    option (google.api.http).get = "/earth-network/earth/personhood/v1/registration_countries";
  }

  // DemocraticVoter queries a registered human's democratic split.
  rpc DemocraticVoter(QueryDemocraticVoterRequest) returns (QueryDemocraticVoterResponse) {
    option (google.api.http).get = "/earth-network/earth/personhood/v1/democratic_voter/{address}";
  }
}

// QueryParamsRequest is request type for the Query/Params RPC method.
message QueryParamsRequest {}

// QueryParamsResponse is response type for the Query/Params RPC method.
message QueryParamsResponse {
  // params holds all the parameters of this module.
  Params params = 1 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
}

// QueryRegistrationRequest requests a wallet's registration.
message QueryRegistrationRequest {
  string address = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
}

// QueryRegistrationResponse returns a wallet's registration status.
message QueryRegistrationResponse {
  bool registered = 1;
  bool expired = 2;
  Registration registration = 3 [(gogoproto.nullable) = false];
}

// QueryDemocraticOptionsRequest requests all democratic options.
message QueryDemocraticOptionsRequest {}

// QueryDemocraticOptionsResponse returns all democratic options.
message QueryDemocraticOptionsResponse {
  repeated DemocraticOption options = 1 [(gogoproto.nullable) = false];
  string reward_index = 2 [
    (cosmos_proto.scalar) = "cosmos.Int",
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false
  ];
  string total_weight = 3 [
    (cosmos_proto.scalar) = "cosmos.Int",
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false
  ];
  // registrations is the number of currently registered humans.
  uint64 registrations = 4;
}

// QueryDemocraticVoterRequest requests a voter's democratic split.
message QueryDemocraticVoterRequest {
  string address = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
}

// QueryDemocraticVoterResponse returns a voter's democratic split.
message QueryDemocraticVoterResponse {
  DemocraticVoter voter = 1 [(gogoproto.nullable) = false];
}

// QueryRegistrationsByDscRequest identifies a Document Signer by the hex-encoded
// dsc_key commitment recorded on its registrations.
message QueryRegistrationsByDscRequest {
  string dsc_key = 1;
}
message QueryRegistrationsByDscResponse {
  uint64 count = 1;
}

// CountryCount is one country's registration total.
message CountryCount {
  string country = 1; // ISO 3166-1 alpha-2, "" for unknown
  uint64 count = 2;
}

message QueryRegistrationCountriesRequest {}
message QueryRegistrationCountriesResponse {
  repeated CountryCount countries = 1 [(gogoproto.nullable) = false];
}
