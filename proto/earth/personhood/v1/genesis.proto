syntax = "proto3";
package earth.personhood.v1;

import "amino/amino.proto";
import "earth/personhood/v1/params.proto";
import "earth/personhood/v1/registration.proto";
import "gogoproto/gogo.proto";

option go_package = "github.com/earth-network/earth/x/personhood/types";

// GenesisState defines the personhood module's genesis state.
message GenesisState {
  // params defines all the parameters of the module.
  Params params = 1 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];

  // registrations is every live registered passport. Each carries the
  // nullifier that stops a passport registering twice, and the identity leaf
  // it holds. Every index over them (by Document Signer, by country, by
  // registration time, the count) is rebuilt at InitGenesis, and so is the
  // identity tree: its leaves are these registrations' leaves at their
  // indexes, and zero everywhere else below identity_tree_size.
  repeated Registration registrations = 2 [(gogoproto.nullable) = false];

  // last_buyback is the ANML buyback-and-burn clock, in unix nanoseconds.
  //
  // Always exported as ZERO, deliberately: the buyback mints for elapsed
  // wall-clock time, and a chain restarted from an export was not running
  // during the gap. Zero means "start the clock here".
  int64 last_buyback = 3;

  // identity_tree_size is the identity tree's append cursor: every leaf ever
  // written, zeroed ones included.
  uint64 identity_tree_size = 4;

  // identity_roots is the anchor history, oldest first; the last is the
  // latest. InitGenesis records the rebuilt root as the latest if it differs.
  repeated IdentityRoot identity_roots = 5 [(gogoproto.nullable) = false];

  // claim_nullifiers are the ANML claims of the days still refused a second
  // claim (today and yesterday).
  repeated ClaimNullifier claim_nullifiers = 6 [(gogoproto.nullable) = false];

  // caretaker_votes are the live caretaker splits' leases.
  repeated CaretakerVote caretaker_votes = 7 [(gogoproto.nullable) = false];

  // referrer_bindings are the live referral addresses.
  repeated ReferrerBinding referrer_bindings = 8 [(gogoproto.nullable) = false];

  // used_bindings are the registration bindings still refused for reuse
  // (see UsedRegistrationBinding).
  repeated UsedRegistrationBinding used_bindings = 9 [(gogoproto.nullable) = false];

  // pending_dsc_purges are the revoked Document Signers whose registrations
  // are still being retired (a bounded batch a block). Carried so an export
  // taken mid-purge finishes it.
  repeated bytes pending_dsc_purges = 10;

  // The daily registration rate counters (see RateCounter): carried so an
  // export does not reset the day's caps, nor the network's previous-day
  // total they scale against.
  repeated DscRateCounter dsc_rates = 11 [(gogoproto.nullable) = false];
  repeated CountryRateCounter country_rates = 12 [(gogoproto.nullable) = false];
  RateCounter network_rate = 13 [(gogoproto.nullable) = false];

  // lease_hold keeps a lowered caretaker_vote_seconds from shortening the
  // activation bound before the leases cast under the old one have lapsed.
  LeaseHold lease_hold = 14 [(gogoproto.nullable) = false];
}

// DscRateCounter is one Document Signer's rate counter.
message DscRateCounter {
  bytes dsc_key = 1;
  RateCounter counter = 2 [(gogoproto.nullable) = false];
}

// CountryRateCounter is one issuing country's (or the unknown bucket's) rate
// counter.
message CountryRateCounter {
  string country = 1;
  RateCounter counter = 2 [(gogoproto.nullable) = false];
}
