syntax = "proto3";
package earth.personhood.module.v1;

import "cosmos/app/v1alpha1/module.proto";

option go_package = "github.com/earth-network/earth/x/personhood/types";

// Module is the config object for the module.
message Module {
  option (cosmos.app.v1alpha1.module) = {go_import: "github.com/earth-network/earth/x/personhood"};

  // authority defines the custom module authority.
  // If not set, defaults to the governance module.
  string authority = 1;
}
