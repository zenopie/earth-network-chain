syntax = "proto3";
package earth.shieldedspike.v1;

import "cosmos/msg/v1/msg.proto";

option go_package = "github.com/earth-network/earth/x/shieldedspike/types";

// Msg is the spike's private Msg service. Throwaway: Phase 0 of the privacy
// redesign, proving an unsigned tx can pay its fee from a module account.
service Msg {
  option (cosmos.msg.v1.service) = true;

  // PrivateNoop spends a (stub) shielded note to pay the tx fee and does nothing else.
  rpc PrivateNoop(MsgPrivateNoop) returns (MsgPrivateNoopResponse);
}

// MsgPrivateNoop has NO signer field. Its signers are defined as empty through
// x/tx signing.CustomGetSigner. Authorization is the proof; replay protection
// is the nullifier.
message MsgPrivateNoop {
  // proof stands in for a transfer proof whose public inputs bind fee and nullifier.
  bytes proof = 1;
  // fee is the uerth amount the proof releases from the shielded pool to fee_collector.
  string fee = 2;
  // nullifier of the spent note.
  bytes nullifier = 3;
}

// MsgPrivateNoopResponse is empty.
message MsgPrivateNoopResponse {}
