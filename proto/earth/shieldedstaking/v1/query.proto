syntax = "proto3";
package earth.shieldedstaking.v1;

import "amino/amino.proto";
import "cosmos/base/query/v1beta1/pagination.proto";
import "cosmos/staking/v1beta1/staking.proto";
import "cosmos_proto/cosmos.proto";
import "earth/shieldedstaking/v1/params.proto";
import "earth/shieldedstaking/v1/shieldedstaking.proto";
import "gogoproto/gogo.proto";
import "google/api/annotations.proto";

option go_package = "github.com/earth-network/earth/x/shieldedstaking/types";

// Query is private staking's read side: rates, supplies, records, Groundworks votes
// and proposal snapshots. Nothing here is per-owner.
service Query {
  // Params queries the module parameters.
  rpc Params(QueryParamsRequest) returns (QueryParamsResponse) {
    option (google.api.http).get = "/earth/shieldedstaking/v1/params";
  }
  // Epoch is the epoch in progress.
  rpc Epoch(QueryEpochRequest) returns (QueryEpochResponse) {
    option (google.api.http).get = "/earth/shieldedstaking/v1/epoch";
  }
  // Validator is one validator's book, live rate and derth supply.
  rpc Validator(QueryValidatorRequest) returns (QueryValidatorResponse) {
    option (google.api.http).get = "/earth/shieldedstaking/v1/validators/{validator}";
  }
  // Validators is every validator, paged: its book, its x/staking record and
  // whether it takes delegations. Everything a wallet needs to quote a
  // delegation, undelegation, redelegation or stake vote, read as one list
  // so that no query names the validator a wallet is about to act on (a
  // per-validator read ties the asking IP to an intent shortly before a
  // public msg). Pages walk x/staking's validators in its key order; the
  // last page (no next_key) also carries every book whose validator
  // x/staking has removed.
  rpc Validators(QueryValidatorsRequest) returns (QueryValidatorsResponse) {
    option (google.api.http).get = "/earth/shieldedstaking/v1/validators";
  }
  // UnbondRecord is one epoch's private undelegation from a validator.
  rpc UnbondRecord(QueryUnbondRecordRequest) returns (QueryUnbondRecordResponse) {
    option (google.api.http).get = "/earth/shieldedstaking/v1/unbond/{validator}/{epoch}";
  }
  // UnbondPayout is a queued undelegation payout (not found once paid).
  rpc UnbondPayout(QueryUnbondPayoutRequest) returns (QueryUnbondPayoutResponse) {
    option (google.api.http).get = "/earth/shieldedstaking/v1/unbond_payouts/{id}";
  }
  // GroundworksVote is one Groundworks vote, by id.
  rpc GroundworksVote(QueryGroundworksVoteRequest) returns (QueryGroundworksVoteResponse) {
    option (google.api.http).get = "/earth/shieldedstaking/v1/groundworks_votes/{id}";
  }
  // GroundworksVotes lists every Groundworks vote (a wallet finds its own by
  // its notes' tags; nothing asks about one tag).
  rpc GroundworksVotes(QueryGroundworksVotesRequest) returns (QueryGroundworksVotesResponse) {
    option (google.api.http).get = "/earth/shieldedstaking/v1/groundworks_votes";
  }
  // Snapshot is a proposal's stake-vote snapshot.
  rpc Snapshot(QuerySnapshotRequest) returns (QuerySnapshotResponse) {
    option (google.api.http).get = "/earth/shieldedstaking/v1/snapshots/{proposal_id}";
  }
  // StakeTree is the stake note tree's size and latest recorded root.
  rpc StakeTree(QueryStakeTreeRequest) returns (QueryStakeTreeResponse) {
    option (google.api.http).get = "/earth/shieldedstaking/v1/stake_tree";
  }
  // StakeNullifier reports whether a stake nullifier (hex) is spent.
  rpc StakeNullifier(QueryStakeNullifierRequest) returns (QueryStakeNullifierResponse) {
    option (google.api.http).get = "/earth/shieldedstaking/v1/stake_nullifiers/{nullifier}";
  }
  // StakeNullifierTree pages the stake nullifier tree's values in insertion
  // order (leaf index start+1, start+2, ...; leaf 0 is the sentinel), with its
  // size and roots: what a wallet replays to build a vote's non-membership
  // witness at a snapshot (ProposalSnapshot.nf_size).
  rpc StakeNullifierTree(QueryStakeNullifierTreeRequest) returns (QueryStakeNullifierTreeResponse) {
    option (google.api.http).get = "/earth/shieldedstaking/v1/stake_nullifier_tree";
  }
  // DebtTree pages the slash debt tree's rows in insertion order (leaf
  // index start+1, ...; leaf 0 is the sentinel) with its size and root, and
  // the label window: what a wallet needs to clear a label or vote a
  // labelled note.
  rpc DebtTree(QueryDebtTreeRequest) returns (QueryDebtTreeResponse) {
    option (google.api.http).get = "/earth/shieldedstaking/v1/debt_tree";
  }
  // Move is a private redelegation still open to slashing (not found once
  // its window closed), and its debt row if slashed.
  rpc Move(QueryMoveRequest) returns (QueryMoveResponse) {
    option (google.api.http).get = "/earth/shieldedstaking/v1/moves/{key}";
  }
  // Vintages is one validator's stake vintages (v1.3.0): the current month,
  // the base vintage, each live vintage with its supply, asset denom and
  // retirement time, each retiring one, and (paged, oldest first) its
  // retired vintages not yet fully withdrawn, with their held payout's
  // state. For explorers: it names the validator, so wallets use
  // VintageBooks.
  rpc Vintages(QueryVintagesRequest) returns (QueryVintagesResponse) {
    option (google.api.http).get = "/earth/shieldedstaking/v1/vintages/{validator}";
  }
  // VintageInfo is the chain's vintage clock: the current month, the base
  // vintage (the unsuffixed denom's month) and the next retirement time.
  // Names no validator.
  rpc VintageInfo(QueryVintageInfoRequest) returns (QueryVintageInfoResponse) {
    option (google.api.http).get = "/earth/shieldedstaking/v1/vintage_info";
  }
  // VintageBooks is every validator's stake vintages in one whole-chain
  // list, paged by (validator, vintage): live, retiring and retired (not
  // fully withdrawn) vintages with their supply and, when retired, the
  // held payout's state. Wallets read it whole, so that no query names the
  // validators they hold (Query/Vintages, for explorers, does).
  rpc VintageBooks(QueryVintageBooksRequest) returns (QueryVintageBooksResponse) {
    option (google.api.http).get = "/earth/shieldedstaking/v1/vintage_books";
  }
}

// QueryParamsRequest is the request type for Query/Params.
message QueryParamsRequest {}

// QueryParamsResponse is the response type for Query/Params.
message QueryParamsResponse {
  Params params = 1 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
}

// QueryEpochRequest is the request type for Query/Epoch.
message QueryEpochRequest {}

// QueryEpochResponse is the response type for Query/Epoch.
message QueryEpochResponse {
  Epoch epoch = 1 [(gogoproto.nullable) = false];
}

// QueryValidatorRequest is the request type for Query/Validator.
message QueryValidatorRequest {
  string validator = 1;
}

// QueryValidatorResponse is the response type for Query/Validator.
message QueryValidatorResponse {
  ValidatorState state = 1 [(gogoproto.nullable) = false];
  // rate is the live rate_v, ERTH per derth.
  string rate = 2 [
    (cosmos_proto.scalar) = "cosmos.Dec",
    (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  // supply of derth/<validator>.
  string supply = 3 [
    (cosmos_proto.scalar) = "cosmos.Int",
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  // backing is delegation value + unwithdrawn rewards + pending delegations
  // - pending undelegations.
  string backing = 4 [
    (cosmos_proto.scalar) = "cosmos.Int",
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
}

// QueryValidatorsRequest is the request type for Query/Validators. The
// page limit is at most 200 (0: 100).
message QueryValidatorsRequest {
  cosmos.base.query.v1beta1.PageRequest pagination = 1;
}

// QueryValidatorsResponse is one page of Query/Validators. height is the
// block the page was read at: a wallet reads every page at the same height
// (the x-cosmos-block-height header) so the quotes are of one state.
message QueryValidatorsResponse {
  repeated ValidatorQuote validators = 1 [(gogoproto.nullable) = false];
  cosmos.base.query.v1beta1.PageResponse pagination = 2;
  int64 height = 3;
}

// ValidatorQuote is what quoting a staking msg at one validator reads
// (ORCHARD_DESIGN.md 12.2): the book B = D + W + P - U and S, the rate,
// the queue, bond status and the delegation refusals.
message ValidatorQuote {
  // validator is the operator address (canonical bech32).
  string validator = 1;
  // staking is x/staking's validator: status (bonded, unbonding, unbonded),
  // jailed, tokens, delegator shares, commission, description, unbonding
  // height and time. Empty (operator_address "") for a book whose validator
  // x/staking has removed.
  cosmos.staking.v1beta1.Validator staking = 2 [(gogoproto.nullable) = false];
  // tombstoned: x/slashing tombstoned its consensus key.
  bool tombstoned = 3;
  // delegatable: a delegation or a redelegation into it would be taken now
  // (not unknown, jailed, tombstoned or slashed to nothing, and its book is
  // not settling: S = 0 with B > 0). refusal is why not ("" when
  // delegatable). Undelegations, redelegations out and stake votes do not
  // depend on it.
  bool delegatable = 4;
  string refusal = 5;
  // book is the module's ValidatorState: pending_delegation (P, the queue),
  // pending_undelegation (U), derth_supply (S), epoch_rate (Groundworks
  // weight), slash_debt. Zero values when it has no book yet.
  ValidatorState book = 6 [(gogoproto.nullable) = false];
  // backing is B = D + W + P - U, supply S and rate B / S (1 while S = 0):
  // the live values every conversion uses.
  string backing = 7 [
    (cosmos_proto.scalar) = "cosmos.Int",
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  string supply = 8 [
    (cosmos_proto.scalar) = "cosmos.Int",
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  string rate = 9 [
    (cosmos_proto.scalar) = "cosmos.Dec",
    (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  // delegation is D, the module's delegation in tokens (truncated), and
  // rewards W, its unwithdrawn uerth rewards: with P and U, how a
  // redelegation's value splits between the queue and the bonded part.
  string delegation = 10 [
    (cosmos_proto.scalar) = "cosmos.Int",
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  string rewards = 11 [
    (cosmos_proto.scalar) = "cosmos.Int",
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  // redelegations are the module's x/staking redelegations out of this
  // validator, one per destination: what a MsgRedelegate's gas grows with.
  repeated RedelegationLoad redelegations = 12 [(gogoproto.nullable) = false];
}

// RedelegationLoad is the module's x/staking redelegation record from one
// validator to dst_validator: entries in it, and counted_entries those of
// positive height (at MaxEntryHeightsPerPair, 1,024, a move first merges
// two: ORCHARD_DESIGN.md 8.3 gas, 8.7).
message RedelegationLoad {
  string dst_validator = 1;
  uint32 entries = 2;
  uint32 counted_entries = 3;
}

// QueryUnbondRecordRequest is the request type for Query/UnbondRecord.
message QueryUnbondRecordRequest {
  string validator = 1;
  uint64 epoch = 2;
}

// QueryUnbondRecordResponse is the response type for Query/UnbondRecord.
message QueryUnbondRecordResponse {
  UnbondRecord record = 1 [(gogoproto.nullable) = false];
}

// QueryUnbondPayoutRequest is the request type for Query/UnbondPayout.
message QueryUnbondPayoutRequest {
  uint64 id = 1;
}

// QueryUnbondPayoutResponse is the payout and its record (status,
// requested, payout: what it will pay is value x payout / requested once
// the record is MATURED).
message QueryUnbondPayoutResponse {
  UnbondPayout payout = 1 [(gogoproto.nullable) = false];
  UnbondRecord record = 2 [(gogoproto.nullable) = false];
}

// QueryGroundworksVoteRequest is the request type for Query/GroundworksVote.
message QueryGroundworksVoteRequest {
  uint64 id = 1;
}

// QueryGroundworksVoteResponse is the response type for Query/GroundworksVote.
message QueryGroundworksVoteResponse {
  GroundworksVote vote = 1 [(gogoproto.nullable) = false];
}

// QueryGroundworksVotesRequest is the request type for Query/GroundworksVotes.
message QueryGroundworksVotesRequest {
  cosmos.base.query.v1beta1.PageRequest pagination = 1;
}

// QueryGroundworksVotesResponse is the response type for Query/GroundworksVotes.
message QueryGroundworksVotesResponse {
  repeated GroundworksVote votes = 1 [(gogoproto.nullable) = false];
  cosmos.base.query.v1beta1.PageResponse pagination = 2;
}

// QuerySnapshotRequest is the request type for Query/Snapshot.
message QuerySnapshotRequest {
  uint64 proposal_id = 1;
}

// QuerySnapshotResponse is the response type for Query/Snapshot.
message QuerySnapshotResponse {
  ProposalSnapshot snapshot = 1 [(gogoproto.nullable) = false];
}

// QueryStakeTreeRequest is the request type for Query/StakeTree.
message QueryStakeTreeRequest {}

// QueryStakeTreeResponse is the stake tree's leaf count and its latest
// recorded root (empty before the first note).
message QueryStakeTreeResponse {
  uint64 size = 1;
  bytes root = 2;
}

// QueryStakeNullifierRequest is the request type for Query/StakeNullifier.
message QueryStakeNullifierRequest {
  // nullifier is 32 bytes, hex.
  string nullifier = 1;
}

// QueryStakeNullifierResponse says whether it is spent, and if so its leaf
// index in the stake nullifier tree.
message QueryStakeNullifierResponse {
  bool spent = 1;
  uint64 index = 2;
}

// QueryStakeNullifierTreeRequest asks for up to limit (at most 1000; 0 =
// 1000) values from leaf index start+1 on (start = 0: from the first).
message QueryStakeNullifierTreeRequest {
  uint64 start = 1;
  uint64 limit = 2;
}

// QueryStakeNullifierTreeResponse: values[i] is the value at leaf
// start+1+i. size is the leaf count (sentinel included; 0 before the first
// insert), root the current root and latest_root the root recorded at the
// end of the last block that changed it (what a snapshot takes).
message QueryStakeNullifierTreeResponse {
  repeated bytes values = 1;
  uint64 size = 2;
  bytes root = 3;
  bytes latest_root = 4;
}

// QueryDebtTreeRequest asks for up to limit (at most 1000; 0 = 1000) rows
// from leaf index start+1 on.
message QueryDebtTreeRequest {
  uint64 start = 1;
  uint64 limit = 2;
}

// QueryDebtTreeResponse: rows[i] is the row at leaf start+1+i (its latest
// retained). size is the leaf count (sentinel included; 0 before the first
// row) and root the current root, which a stake proof clearing a label and a
// vote of a labelled note prove against (StakeProof.debt_root,
// MsgStakeVote.debt_root). A label whose move_time is below clear_before
// (block time less window_seconds) may clear now.
message QueryDebtTreeResponse {
  repeated DebtRow rows = 1 [(gogoproto.nullable) = false];
  uint64 size = 2;
  bytes root = 3;
  uint64 window_seconds = 4;
  uint64 clear_before = 5;
}

// QueryMoveRequest names a move by its key (hex).
message QueryMoveRequest {
  string key = 1;
}

// QueryMoveResponse: the move while open (found = true), and its debt row's
// retained when slashed (slashed = true; kept after the move closed).
message QueryMoveResponse {
  Move move = 1 [(gogoproto.nullable) = false];
  bool found = 2;
  bool slashed = 3;
  uint64 retained = 4;
}

// QueryVintagesRequest: pagination pages the retired vintages (by month;
// at most 100 a page).
message QueryVintagesRequest {
  string validator = 1;
  cosmos.base.query.v1beta1.PageRequest pagination = 2;
}

// QueryVintagesResponse is a validator's vintages as of the block read.
message QueryVintagesResponse {
  // current_vintage is the vintage a delegation or check-in credits now
  // (the block time's UTC month, YYYYMM); base_vintage the one whose asset
  // is the unsuffixed derth/<validator>.
  uint32 current_vintage = 1;
  uint32 base_vintage = 2;
  // live is every live vintage (current_vintage and the 12 before it) that
  // holds supply, oldest first.
  repeated LiveVintage live = 3 [(gogoproto.nullable) = false];
  // retired is one page of the retired vintages not fully withdrawn.
  repeated RetiredVintageState retired = 4 [(gogoproto.nullable) = false];
  cosmos.base.query.v1beta1.PageResponse pagination = 5;
  // next_retirement is when the oldest live vintage retires (unix seconds):
  // 00:00 UTC on the 1st of current_vintage + 1.
  int64 next_retirement = 6;
  // retiring is every vintage past its retirement time whose value the
  // epoch end has not booked yet, oldest first: it still earns in the
  // validator's book (refusing every msg) and becomes a retired vintage,
  // withdrawable, at the next epoch end.
  repeated LiveVintage retiring = 7 [(gogoproto.nullable) = false];
}

// LiveVintage is one live vintage at a validator.
message LiveVintage {
  uint32 vintage = 1;
  // denom is its stake asset's denom (zk/privacy.AssetID of it is the
  // circuit's asset).
  string denom = 2;
  string supply = 3 [
    (cosmos_proto.scalar) = "cosmos.Int",
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  // retires_at is 00:00 UTC on the 1st of vintage + 13 (unix seconds); a
  // check-in before then moves the stake into the current vintage.
  int64 retires_at = 4;
  // expected_completion, for a retiring vintage only (0 otherwise): the
  // earliest its value can be paid (unix seconds), the current epoch's end
  // plus x/staking's unbonding_time. An estimate: the epoch end books and
  // undelegates it, later if x/staking's max_entries defers it.
  int64 expected_completion = 5;
}

// RetiredVintageState is a retired vintage, its asset and its held payout's
// unbond record (status, completion, payout once matured).
message RetiredVintageState {
  RetiredVintage vintage = 1 [(gogoproto.nullable) = false];
  string denom = 2;
  // expected_completion (unix seconds) is when the held value's unbonding
  // completes: the record's completion while UNBONDING (exact); while the
  // record is still PENDING (x/staking's max_entries deferred its
  // undelegation), an estimate, the current epoch's end plus
  // unbonding_time (unknown until an epoch end undelegates it); 0 once
  // MATURED (withdrawals are paid in the next block) or nothing is held.
  int64 expected_completion = 4;
  // record is the held payout's unbond record (absent when nothing is
  // held); withdrawals before its maturity are paid at maturity, after it
  // in the next block.
  UnbondRecord record = 3;
}

// QueryVintageInfoRequest is the request type for Query/VintageInfo.
message QueryVintageInfoRequest {}

// QueryVintageInfoResponse: current_vintage is the vintage a delegation or
// check-in credits now (the block time's UTC month, YYYYMM); base_vintage
// the one whose asset is the unsuffixed derth/<validator>; next_retirement
// when the oldest live vintage retires (unix seconds: 00:00 UTC on the 1st
// of current_vintage + 1).
message QueryVintageInfoResponse {
  uint32 current_vintage = 1;
  uint32 base_vintage = 2;
  int64 next_retirement = 3;
}

// QueryVintageBooksRequest: pagination pages the whole list by
// (validator, vintage) key (at most 100 entries a page; next_key from the
// previous page, offset unsupported).
message QueryVintageBooksRequest {
  cosmos.base.query.v1beta1.PageRequest pagination = 1;
}

// QueryVintageBooksResponse is one page of every validator's vintages, with
// the vintage clock as of the block read.
message QueryVintageBooksResponse {
  uint32 current_vintage = 1;
  uint32 base_vintage = 2;
  int64 next_retirement = 3;
  repeated VintageBookEntry entries = 4 [(gogoproto.nullable) = false];
  cosmos.base.query.v1beta1.PageResponse pagination = 5;
}

// VintageBookEntry is one (validator, vintage) of Query/VintageBooks.
message VintageBookEntry {
  string validator = 1;
  uint32 vintage = 2;
  // denom is its stake asset's denom (zk/privacy.AssetID of it is the
  // circuit's asset).
  string denom = 3;
  // state: "live" (msgs accepted), "retiring" (past retires_at, still in
  // the book and earning; booked as retired at the next epoch end) or
  // "retired" (withdrawals only; retired and record below).
  string state = 4;
  // supply is the vintage's derth in the book (live or retiring; empty
  // when retired: see retired.remaining_supply).
  string supply = 5 [
    (cosmos_proto.scalar) = "cosmos.Int",
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = true
  ];
  // retires_at is 00:00 UTC on the 1st of vintage + 13 (unix seconds).
  int64 retires_at = 6;
  RetiredVintage retired = 7;
  // record is the held payout's unbond record while value is held.
  UnbondRecord record = 8;
  // expected_completion (unix seconds): when a retiring or retired
  // vintage's value is paid, as RetiredVintageState.expected_completion
  // (retiring: the current epoch's end plus unbonding_time, an estimate);
  // 0 for a live vintage, a matured record or nothing held.
  int64 expected_completion = 9;
}
