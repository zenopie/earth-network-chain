syntax = "proto3";
package earth.shieldedstaking.v1;

import "amino/amino.proto";
import "cosmos_proto/cosmos.proto";
import "gogoproto/gogo.proto";

option go_package = "github.com/earth-network/earth/x/shieldedstaking/types";

// Params defines the parameters of private staking.
message Params {
  option (amino.name) = "earth/x/shieldedstaking/Params";
  option (gogoproto.equal) = true;

  // epoch_seconds is the length of an epoch. Delegations and undelegations
  // queued during an epoch are executed, and rewards compounded, at its end.
  uint64 epoch_seconds = 1;

  // min_position is the smallest derth a Groundworks position may lock.
  // Positions are weighed per validator (one Groundworks voter each), so no
  // epoch work grows with their number; this only keeps dust out.
  string min_position = 2 [
    (cosmos_proto.scalar) = "cosmos.Int",
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];

  // max_positions (3) is retired: positions are aggregated per validator.
  reserved 3;
  reserved "max_positions";

  // stake_root_window_seconds is how long a superseded stake-tree root stays
  // an anchor (the latest never expires; a vote's snapshot root is accepted
  // for its proposal).
  uint64 stake_root_window_seconds = 4;

  // min_delegation is the smallest private delegation, in uerth, and the
  // least derth one may mint. It keeps validator books from being created
  // for dust (every book is processed at epoch end) and bounds the rounding
  // a donation to the validator's rewards pool can inflict on a delegator.
  string min_delegation = 5 [
    (cosmos_proto.scalar) = "cosmos.Int",
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
}
