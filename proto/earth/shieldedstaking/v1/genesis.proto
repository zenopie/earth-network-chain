syntax = "proto3";
package earth.shieldedstaking.v1;

import "amino/amino.proto";
import "earth/shieldedstaking/v1/params.proto";
import "earth/shieldedstaking/v1/shieldedstaking.proto";
import "gogoproto/gogo.proto";

option go_package = "github.com/earth-network/earth/x/shieldedstaking/types";

// GenesisState defines private staking's genesis state. The SDK delegations
// and unbonding entries it books against live in x/staking's genesis.
message GenesisState {
  Params params = 1 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  // epoch is absent at launch: the first epoch starts at InitGenesis.
  Epoch epoch = 2;
  repeated ValidatorState validators = 3 [(gogoproto.nullable) = false];
  repeated UnbondRecord unbond_records = 4 [(gogoproto.nullable) = false];
  repeated Position positions = 5 [(gogoproto.nullable) = false];
  uint64 next_position_id = 6;
  repeated ProposalSnapshot snapshots = 7 [(gogoproto.nullable) = false];
  repeated StakeVote votes = 8 [(gogoproto.nullable) = false];
  // The stake note tree: every leaf in order, the spent nullifiers, and the
  // roots still in the window (the latest last).
  repeated bytes stake_commitments = 9;
  repeated bytes stake_nullifiers = 10;
  repeated StakeRoot stake_roots = 11 [(gogoproto.nullable) = false];
  // snapshot_seq is the last snapshot sequence number issued.
  uint64 snapshot_seq = 12;
  repeated SupplyCheckpoint supply_checkpoints = 13 [(gogoproto.nullable) = false];
  EpochSweep epoch_sweep = 14;
  // pending_releases are removed validators (operator address bytes) whose
  // reward escrow release failed; InitGenesis records their escrows again and
  // the epoch end retries the release. Without them an exported chain would
  // forget the escrow, and its balance with it.
  repeated bytes pending_releases = 15;
  // retiring_escrows are the scheduled retirements of operators that removed
  // their whole self-bond (escrow.go), kept at their original release time.
  repeated RetiringEscrow retiring_escrows = 16 [(gogoproto.nullable) = false];
}

// RetiringEscrow is a scheduled reward-escrow retirement: validator's escrow
// is paid out at release_at (unix nanoseconds) if its operator has not bonded
// again.
message RetiringEscrow {
  int64 release_at = 1;
  bytes validator = 2;
}
