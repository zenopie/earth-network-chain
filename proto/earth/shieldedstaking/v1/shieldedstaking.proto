syntax = "proto3";
package earth.shieldedstaking.v1;

import "amino/amino.proto";
import "cosmos/gov/v1/gov.proto";
import "cosmos_proto/cosmos.proto";
import "earth/allocation/v1/allocation.proto";
import "gogoproto/gogo.proto";

option go_package = "github.com/earth-network/earth/x/shieldedstaking/types";

// Epoch is the epoch in progress.
message Epoch {
  // number of the epoch in progress; unbond/<valoper>/<number> notes minted
  // now are executed at its end.
  uint64 number = 1;
  // start_time and end_time, unix seconds. The epoch ends in the first block
  // whose time is at or after end_time.
  int64 start_time = 2;
  int64 end_time = 3;
}

// ValidatorState is the module's book for one validator.
message ValidatorState {
  // validator operator address (bech32).
  string validator = 1;
  // pending_delegation is ERTH spent into the module for this validator and
  // not yet delegated: this epoch's delegations, and anything a failed
  // epoch-end left behind.
  string pending_delegation = 2 [
    (cosmos_proto.scalar) = "cosmos.Int",
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  // pending_undelegation is the ERTH value of unbond notes minted and not yet
  // undelegated (sum of the PENDING records' target).
  string pending_undelegation = 3 [
    (cosmos_proto.scalar) = "cosmos.Int",
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  // epoch_rate is rate_v as of the last epoch end: ERTH per derth. It weighs
  // Groundworks positions. Conversions use the live rate.
  string epoch_rate = 4 [
    (cosmos_proto.scalar) = "cosmos.Dec",
    (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  // derth_supply is S_v: the derth/<validator> outstanding, in stake notes
  // and positions. derth is never a coin.
  string derth_supply = 5 [
    (cosmos_proto.scalar) = "cosmos.Int",
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  // checkpoint_seq is the latest snapshot sequence for which this book's
  // derth_supply was checkpointed (SupplyCheckpoint) before it changed.
  uint64 checkpoint_seq = 6;
}

// SupplyCheckpoint is a book's derth supply just before its first change
// after the snapshot with sequence seq: the supply every snapshot with a
// sequence in (the book's previous checkpoint, seq] saw.
message SupplyCheckpoint {
  string validator = 1;
  uint64 seq = 2;
  string supply = 3 [
    (cosmos_proto.scalar) = "cosmos.Int",
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
}

// EpochSweep is the epoch-end processing of validator books, spread over
// blocks: active while a sweep is under way, cursor the last book processed.
message EpochSweep {
  bool active = 1;
  string cursor = 2;
}

// UnbondStatus is where an epoch's undelegation for one validator stands.
enum UnbondStatus {
  option (gogoproto.goproto_enum_prefix) = false;
  // UNBOND_STATUS_PENDING: notes minted, SDK undelegation not yet made.
  UNBOND_STATUS_PENDING = 0;
  // UNBOND_STATUS_UNBONDING: an SDK unbonding entry exists.
  UNBOND_STATUS_UNBONDING = 1;
  // UNBOND_STATUS_MATURED: the entry paid out; notes can be claimed.
  UNBOND_STATUS_MATURED = 2;
}

// UnbondRecord backs the unbond/<validator>/<epoch> stake notes (claims).
message UnbondRecord {
  string validator = 1;
  uint64 epoch = 2;
  UnbondStatus status = 3;
  // requested is the total value of the claim notes minted.
  string requested = 4 [
    (cosmos_proto.scalar) = "cosmos.Int",
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  // target is what to undelegate: requested, less the share of any slash
  // that hit the validator while the record was pending.
  string target = 5 [
    (cosmos_proto.scalar) = "cosmos.Int",
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  // undelegated is what the SDK's Undelegate returned (the entry's initial
  // balance, or this record's share of a merged entry).
  string undelegated = 6 [
    (cosmos_proto.scalar) = "cosmos.Int",
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  // creation_height is the SDK entry's creation height (its key).
  int64 creation_height = 7;
  // completion_time is the SDK entry's, unix nanoseconds.
  int64 completion_time = 8;
  // payout is the ERTH the entry paid for this record at maturity.
  string payout = 9 [
    (cosmos_proto.scalar) = "cosmos.Int",
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  // outstanding is the note value not yet claimed.
  string outstanding = 10 [
    (cosmos_proto.scalar) = "cosmos.Int",
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  // paid is the ERTH claimed so far.
  string paid = 11 [
    (cosmos_proto.scalar) = "cosmos.Int",
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
}

// Position is a Groundworks position: derth locked in the module, its owner
// known only by owner_tag, which its stake proofs must reproduce.
message Position {
  uint64 id = 1;
  string validator = 2;
  string derth = 3 [
    (cosmos_proto.scalar) = "cosmos.Int",
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  repeated earth.allocation.v1.AllocationWeight splits = 4 [(gogoproto.nullable) = false];
  // pubkey, nonce: the retired one-time position key; the owner proves
  // owner_tag instead.
  reserved 5, 6;
  reserved "pubkey", "nonce";
  int64 created_height = 7;
  // weight is what the position carries in the Groundworks stream (derth x
  // its validator's epoch rate, 0 without a live split). Not stored: the
  // stream weighs a validator's positions together (one voter per
  // validator), and queries fill this in.
  string weight = 8 [
    (cosmos_proto.scalar) = "cosmos.Int",
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  // owner_tag is H(TAG_OTAG, owner_pk, salt), 32 bytes (circuits/stake).
  bytes owner_tag = 9;
  // split_epoch is the Groundworks stream's allocation epoch the split was
  // cast in. A governance reset bumps that epoch, and a split from an older
  // one no longer counts (the owner votes again with MsgUpdatePosition).
  uint64 split_epoch = 10;
}

// StakeRoot is a stake-tree root recorded at the end of a block that changed
// the tree.
message StakeRoot {
  bytes root = 1;
  int64 height = 2;
  // time of that block, unix seconds; the window runs from here.
  int64 time = 3;
  uint64 tree_size = 4;
}

// ProposalSnapshot is taken when an x/gov proposal enters voting.
message ProposalSnapshot {
  uint64 proposal_id = 1;
  // root is the stake tree's latest root at that moment; stake votes are
  // proven against it. tree_size is its leaf count.
  bytes root = 2;
  uint64 tree_size = 3;
  int64 height = 4;
  // voting_end, unix nanoseconds. Votes are accepted before it.
  int64 voting_end = 5;
  // validators is the per-validator snapshot of snapshots taken before
  // seq existed (genesis compatibility); empty for newer ones, whose supplies
  // are read from the books' SupplyCheckpoints.
  repeated ValidatorSnapshot validators = 6 [(gogoproto.nullable) = false];
  // seq is this snapshot's sequence number (1, 2, ...); 0 for the legacy form.
  uint64 seq = 7;
}

// ValidatorSnapshot is one validator's derth supply and rate at a snapshot.
message ValidatorSnapshot {
  string validator = 1;
  string supply = 2 [
    (cosmos_proto.scalar) = "cosmos.Int",
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  string rate = 3 [
    (cosmos_proto.scalar) = "cosmos.Dec",
    (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
}

// StakeVote is one private stake vote: spent stake notes' (keyed by the
// stake proof's first nullifier) or a position's.
message StakeVote {
  uint64 proposal_id = 1;
  // key is 0x00 || the stake proof's first nullifier (32 bytes) of a note vote,
  // or 0x01 || the position id (8 bytes big-endian) of a position vote.
  bytes key = 2;
  bool position = 3;
  string validator = 4;
  string derth = 5 [
    (cosmos_proto.scalar) = "cosmos.Int",
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  repeated cosmos.gov.v1.WeightedVoteOption options = 6;
}

// VoteTally is the derth voted privately for one validator on one proposal,
// per option (weighted), maintained as votes arrive so the gov tally never
// walks individual votes. Derived: rebuilt from the votes at genesis.
message VoteTally {
  string yes = 1 [
    (cosmos_proto.scalar) = "cosmos.Dec",
    (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  string abstain = 2 [
    (cosmos_proto.scalar) = "cosmos.Dec",
    (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  string no = 3 [
    (cosmos_proto.scalar) = "cosmos.Dec",
    (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  string no_with_veto = 4 [
    (cosmos_proto.scalar) = "cosmos.Dec",
    (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
}
