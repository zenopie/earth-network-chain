syntax = "proto3";
package earth.shieldedstaking.v1;

import "amino/amino.proto";
import "cosmos/gov/v1/gov.proto";
import "cosmos_proto/cosmos.proto";
import "earth/allocation/v1/allocation.proto";
import "gogoproto/gogo.proto";

option go_package = "github.com/earth-network/earth/x/shieldedstaking/types";

// Epoch is the epoch in progress.
message Epoch {
  // number of the epoch in progress; undelegations made now are executed at
  // its end.
  uint64 number = 1;
  // start_time and end_time, unix seconds. The epoch ends in the first block
  // whose time is at or after end_time.
  int64 start_time = 2;
  int64 end_time = 3;
}

// ValidatorState is the module's book for one validator.
message ValidatorState {
  // validator operator address (bech32).
  string validator = 1;
  // pending_delegation is ERTH spent into the module for this validator and
  // not yet delegated: this epoch's delegations, and anything a failed
  // epoch-end left behind.
  string pending_delegation = 2 [
    (cosmos_proto.scalar) = "cosmos.Int",
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  // pending_undelegation is the ERTH value undelegated privately and not yet
  // undelegated from x/staking (sum of the PENDING records' target).
  string pending_undelegation = 3 [
    (cosmos_proto.scalar) = "cosmos.Int",
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  // epoch_rate is rate_v as of the last epoch end: ERTH per derth. It weighs
  // Groundworks votes. Conversions use the live rate.
  string epoch_rate = 4 [
    (cosmos_proto.scalar) = "cosmos.Dec",
    (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  // derth_supply is S_v: the derth/<validator> outstanding, in stake notes.
  // derth is never a coin.
  string derth_supply = 5 [
    (cosmos_proto.scalar) = "cosmos.Int",
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  // checkpoint_seq is the latest snapshot sequence for which this book's
  // derth_supply was checkpointed (SupplyCheckpoint) before it changed.
  uint64 checkpoint_seq = 6;
  // supply_height is the height of the block in which derth_supply last
  // changed, and supply_at_block_start its value before that block's first
  // change. A snapshot taken in a block pairs the stake roots recorded at
  // the end of the block before, so the supply it sees is the supply at the
  // start of its block (audit 4, I1), not after changes earlier in the block.
  int64 supply_height = 7;
  string supply_at_block_start = 8 [
    (cosmos_proto.scalar) = "cosmos.Int",
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  // slash_debt is the derth taken off derth_supply by slashes of private
  // redelegations INTO this validator (ORCHARD_DESIGN.md 8.7): what
  // x/staking burned from the module's delegation here, valued at the rate,
  // so the rate did not move. The exposed notes pay it as they clear their
  // labels (their exposure counts at its retained value). Only grows.
  string slash_debt = 9 [
    (cosmos_proto.scalar) = "cosmos.Int",
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
}

// Move is a private redelegation while a slash of its source can still reach
// it (until its x/staking entry matures). Its credited derth/<dst> sits,
// labelled with the move, in its owner's note at dst; the label clears once
// the window closes, at what the slash debt tree says it is worth.
message Move {
  // key is the move key: the redelegation's credit nullifier (32 bytes),
  // which the note's label carries.
  bytes key = 1;
  string src_validator = 2;
  string dst_validator = 3;
  // height is the block it ran in; move_time the time its msg named (unix
  // seconds, at most move_time_slack before the block): the label's.
  int64 height = 4;
  uint64 move_time = 5;
  // credited is the derth/<dst> it credited: the note's exposure.
  string credited = 6 [
    (cosmos_proto.scalar) = "cosmos.Int",
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  // shares are its shares of the module's x/staking redelegation entry
  // (src, dst, entry_height): what a slash of src takes, pro rata. Always
  // positive: a move with no entry (nothing bonded moved, or src unbonded)
  // is not recorded.
  string shares = 7 [
    (cosmos_proto.scalar) = "cosmos.Dec",
    (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  int64 entry_height = 8;
  // completion is when the entry matures (unix ns); the record is dropped
  // then (a slashed move keeps its debt row).
  int64 completion = 9;
  // retained is what the exposure is still worth: credited, less the
  // slashes so far.
  string retained = 10 [
    (cosmos_proto.scalar) = "cosmos.Int",
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
}

// DebtRow is one row of the slash debt tree: a slashed move's key and what
// its exposure is still worth.
message DebtRow {
  bytes key = 1;
  uint64 retained = 2;
}

// SupplyCheckpoint is a book's derth supply just before its first change
// after the snapshot with sequence seq: the supply every snapshot with a
// sequence in (the book's previous checkpoint, seq] saw.
message SupplyCheckpoint {
  string validator = 1;
  uint64 seq = 2;
  string supply = 3 [
    (cosmos_proto.scalar) = "cosmos.Int",
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
}

// EpochSweep is the epoch-end processing of validator books, spread over
// blocks: active while a sweep is under way, cursor the last book processed.
message EpochSweep {
  bool active = 1;
  string cursor = 2;
}

// UnbondStatus is where an epoch's undelegation for one validator stands.
enum UnbondStatus {
  option (gogoproto.goproto_enum_prefix) = false;
  // UNBOND_STATUS_PENDING: undelegations booked, SDK undelegation not yet
  // made.
  UNBOND_STATUS_PENDING = 0;
  // UNBOND_STATUS_UNBONDING: an SDK unbonding entry exists.
  UNBOND_STATUS_UNBONDING = 1;
  // UNBOND_STATUS_MATURED: the entry paid out; the record's payouts are
  // minted, a bounded number a block.
  UNBOND_STATUS_MATURED = 2;
}

// UnbondRecord is one epoch's private undelegation from one validator: the
// UnbondPayouts queued against it share its payout pro rata.
message UnbondRecord {
  string validator = 1;
  uint64 epoch = 2;
  UnbondStatus status = 3;
  // requested is the total ERTH value of the undelegations booked (the sum
  // of its payouts' values).
  string requested = 4 [
    (cosmos_proto.scalar) = "cosmos.Int",
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  // target is what to undelegate: requested, less the share of any slash
  // that hit the validator while the record was pending.
  string target = 5 [
    (cosmos_proto.scalar) = "cosmos.Int",
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  // undelegated is what the SDK's Undelegate returned (the entry's initial
  // balance, or this record's share of a merged entry).
  string undelegated = 6 [
    (cosmos_proto.scalar) = "cosmos.Int",
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  // creation_height is the SDK entry's creation height (its key).
  int64 creation_height = 7;
  // completion_time is the SDK entry's, unix nanoseconds.
  int64 completion_time = 8;
  // payout is the ERTH the entry paid for this record at maturity.
  string payout = 9 [
    (cosmos_proto.scalar) = "cosmos.Int",
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  // outstanding is the value of its payouts not yet paid.
  string outstanding = 10 [
    (cosmos_proto.scalar) = "cosmos.Int",
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  // paid is the ERTH paid out so far.
  string paid = 11 [
    (cosmos_proto.scalar) = "cosmos.Int",
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
}

// UnbondPayout is one private undelegation's queued payout. At its record's
// maturity the chain mints value x record.payout / record.requested ERTH as
// notes to pc with ciphertext (several notes of at most 2^63-1 each when it
// is above that). A payout that fails is kept and retried, never dropped.
message UnbondPayout {
  // id is unique and increasing (MsgUndelegateResponse.payout_id).
  uint64 id = 1;
  string validator = 2;
  uint64 epoch = 3;
  // value is the ERTH value booked at undelegation (its share of
  // record.requested).
  string value = 4 [
    (cosmos_proto.scalar) = "cosmos.Int",
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  bytes pc = 5;
  bytes ciphertext = 6;
  // payout_attempts is how many times paying it failed; retry_at (unix
  // seconds) is when it is tried again, 0 until it first fails.
  uint32 payout_attempts = 7;
  int64 retry_at = 8;
}

// GroundworksVote is one stake note's Groundworks vote: derth (the note's
// unexposed amount when it voted) at validator, split by splits, stored
// under the note's Groundworks tag (circuits/stake gw = H(TAG_GW, nk, rho)).
// The note's owner is not known. Any stake proof spending the note publishes
// the tag and cancels the vote; a stake msg naming a split re-casts it on the
// output in the same tx.
message GroundworksVote {
  // id is the vote's sequence number (its lease's key in the lapse queue).
  uint64 id = 1;
  string validator = 2;
  string derth = 3 [
    (cosmos_proto.scalar) = "cosmos.Int",
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  repeated earth.allocation.v1.AllocationWeight splits = 4 [(gogoproto.nullable) = false];
  // 5, 6, 9: the retired positions' pubkey, nonce and owner_tag.
  reserved 5, 6, 9;
  reserved "pubkey", "nonce", "owner_tag";
  int64 created_height = 7;
  // weight is what the vote carries in the Groundworks stream (derth x its
  // validator's epoch rate, 0 when its split no longer counts). Not stored:
  // the stream weighs a validator's votes together (one voter per
  // validator), and queries fill this in.
  string weight = 8 [
    (cosmos_proto.scalar) = "cosmos.Int",
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  // split_epoch is the Groundworks stream's allocation epoch the split was
  // cast in. A governance reset bumps that epoch, and a split from an older
  // one no longer counts (the owner votes again).
  uint64 split_epoch = 10;
  // split_expires_at is when the split stops counting (unix seconds): cast
  // + x/allocation groundworks_lease_seconds. At that time the vote is
  // dropped from its validator's totals (the stream settled to the expiry
  // first); the owner re-casts with any stake msg naming a split.
  int64 split_expires_at = 11;
  // tag is the note's Groundworks tag (32 bytes).
  bytes tag = 12;
  // pending is derth the note holds exposed to a move's source (its label,
  // move pending_key made at pending_move_time): not yet counted, added to
  // derth once the move's window closes (the label could clear: move_time <
  // ClearBefore) at what the slash debt tree says it is worth (pending_key's
  // row, else all of it). matures_at is when that is due (the window as it
  // stands; a window grown since is waited out). Zero once matured or when
  // there is none.
  string pending = 13 [
    (cosmos_proto.scalar) = "cosmos.Int",
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  bytes pending_key = 14;
  uint64 pending_move_time = 15;
  int64 matures_at = 16;
}

// StakeRoot is a stake-tree root recorded at the end of a block that changed
// the tree.
message StakeRoot {
  bytes root = 1;
  int64 height = 2;
  // time of that block, unix seconds.
  int64 time = 3;
  uint64 tree_size = 4;
  // superseded_at is the time (unix seconds) of the block whose root
  // replaced this one as the latest, 0 while it is the latest. The window
  // runs from here (as x/shielded's RootRecord).
  int64 superseded_at = 5;
}

// ProposalSnapshot is taken when an x/gov proposal enters voting.
message ProposalSnapshot {
  uint64 proposal_id = 1;
  // root is the stake tree's latest root at that moment; stake votes are
  // proven against it. tree_size is its leaf count.
  bytes root = 2;
  uint64 tree_size = 3;
  int64 height = 4;
  // voting_end, unix nanoseconds. Votes are accepted before it.
  int64 voting_end = 5;
  // validators is the per-validator snapshot of snapshots taken before
  // seq existed (genesis compatibility); empty for newer ones, whose supplies
  // are read from the books' SupplyCheckpoints.
  repeated ValidatorSnapshot validators = 6 [(gogoproto.nullable) = false];
  // seq is this snapshot's sequence number (1, 2, ...); 0 for the legacy form.
  uint64 seq = 7;
  // nf_root is the stake nullifier tree's latest recorded root at that moment
  // (the end of the same block as root), nf_size its leaf count (the
  // sentinel included; 0 = nothing inserted, root indexed.EmptyRoot). A
  // stake vote proves its note unspent against it (circuits/vote).
  bytes nf_root = 8;
  uint64 nf_size = 9;
}

// ValidatorSnapshot is one validator's derth supply and rate at a snapshot.
message ValidatorSnapshot {
  string validator = 1;
  string supply = 2 [
    (cosmos_proto.scalar) = "cosmos.Int",
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  string rate = 3 [
    (cosmos_proto.scalar) = "cosmos.Dec",
    (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
}

// StakeVote is one private stake vote: up to two stake notes', keyed by
// their first vote nullifier.
message StakeVote {
  uint64 proposal_id = 1;
  // key is 0x00 || the first vote nullifier (32 bytes).
  bytes key = 2;
  // position (3): the retired position votes' flag.
  reserved 3;
  reserved "position";
  string validator = 4;
  string derth = 5 [
    (cosmos_proto.scalar) = "cosmos.Int",
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  repeated cosmos.gov.v1.WeightedVoteOption options = 6;
  // vote_nullifiers are the vote's two vote nullifiers (a used slot's or an
  // unused slot's padding, indistinguishable; the first the key's).
  repeated bytes vote_nullifiers = 7;
}

// VoteTally is the derth voted privately for one validator on one proposal,
// per option (weighted), maintained as votes arrive so the gov tally never
// walks individual votes. Derived: rebuilt from the votes at genesis.
message VoteTally {
  string yes = 1 [
    (cosmos_proto.scalar) = "cosmos.Dec",
    (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  string abstain = 2 [
    (cosmos_proto.scalar) = "cosmos.Dec",
    (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  string no = 3 [
    (cosmos_proto.scalar) = "cosmos.Dec",
    (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  string no_with_veto = 4 [
    (cosmos_proto.scalar) = "cosmos.Dec",
    (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
}
