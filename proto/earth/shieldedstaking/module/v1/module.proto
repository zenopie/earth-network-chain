syntax = "proto3";
package earth.shieldedstaking.module.v1;

import "cosmos/app/v1alpha1/module.proto";

option go_package = "github.com/earth-network/earth/x/shieldedstaking/types";

// Module is the config object for the private staking module.
message Module {
  option (cosmos.app.v1alpha1.module) = {go_import: "github.com/earth-network/earth/x/shieldedstaking"};

  // authority defines the custom module authority.
  // If not set, defaults to the governance module.
  string authority = 1;
}
