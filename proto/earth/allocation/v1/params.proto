syntax = "proto3";
package earth.allocation.v1;

import "amino/amino.proto";
import "gogoproto/gogo.proto";

option go_package = "github.com/earth-network/earth/x/allocation/types";

// Params defines the parameters for the module.
message Params {
  option (amino.name) = "earth/x/allocation/Params";
  option (gogoproto.equal) = true;

  // address_option_fee is the ERTH (uerth) burned to add an ADDRESS allocation
  // option to the caretaker stream, where adding one is permissionless; this fee
  // deters spam. Groundworks entry is governance-gated and pays no fee — a
  // proposal deposit is its brake.
  uint64 address_option_fee = 1;

  // groundworks_lease_seconds is how long a Groundworks split counts after
  // it was cast or last renewed: an operator's (MsgSetAllocations) and a
  // stake position's (x/shieldedstaking MsgLockPosition, MsgUpdatePosition)
  // alike, as a caretaker split lapses after caretaker_vote_seconds. Casting
  // again renews it. Zero falls back to the default (365 days); otherwise one
  // day to two years. A change applies to splits cast after it.
  uint64 groundworks_lease_seconds = 2;
}
