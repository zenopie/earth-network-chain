syntax = "proto3";

package earth.dex.v1;

import "amino/amino.proto";
import "cosmos/base/v1beta1/coin.proto";
import "cosmos/msg/v1/msg.proto";
import "cosmos_proto/cosmos.proto";
import "earth/dex/v1/params.proto";
import "earth/shielded/v1/shielded.proto";
import "gogoproto/gogo.proto";

option go_package = "github.com/earth-network/earth/x/dex/types";

// Msg defines the Msg service.
service Msg {
  option (cosmos.msg.v1.service) = true;

  // UpdateParams defines a (governance) operation for updating the module
  // parameters. The authority defaults to the x/gov module account.
  rpc UpdateParams(MsgUpdateParams) returns (MsgUpdateParamsResponse);

  // CreatePool opens a new ERTH<->token pool. Permissionless, but refused until
  // the genesis liquidity auction has settled: the auction must be able to claim
  // its bid denom, and one pool per spoke token plus no way to delete a pool
  // means a dust pool created beforehand would block it permanently. The lock
  // lifts itself at settlement.
  rpc CreatePool(MsgCreatePool) returns (MsgCreatePoolResponse);

  // AddLiquidity defines the AddLiquidity RPC.
  rpc AddLiquidity(MsgAddLiquidity) returns (MsgAddLiquidityResponse);

  // RemoveLiquidity begins a liquidity withdrawal. It does not pay out: the
  // shares are escrowed for the unbonding period and then swept to the
  // provider's wallet automatically, with no second transaction.
  rpc RemoveLiquidity(MsgRemoveLiquidity) returns (MsgRemoveLiquidityResponse);

  // Swap defines the Swap RPC.
  rpc Swap(MsgSwap) returns (MsgSwapResponse);

  // StartLiquidityAuction opens the bidding window for the pre-funded genesis
  // liquidity auction. Governance-only, and only meaningful once IBC is live
  // and the intended bid asset actually exists on the chain.
  rpc StartLiquidityAuction(MsgStartLiquidityAuction) returns (MsgStartLiquidityAuctionResponse);

  // BidLiquidityAuction contributes bid_denom to the open auction.
  rpc BidLiquidityAuction(MsgBidLiquidityAuction) returns (MsgBidLiquidityAuctionResponse);

  // ClaimLiquidityAuction pays out a bidder's pro-rata ERTH after settlement.
  rpc ClaimLiquidityAuction(MsgClaimLiquidityAuction) returns (MsgClaimLiquidityAuctionResponse);

  // NoteSwap swaps a shielded note's value through any pool and mints the
  // output as a note. Unsigned private msg; see MsgNoteSwap.
  rpc NoteSwap(MsgNoteSwap) returns (MsgNoteSwapResponse);

  // BuyAnml swaps a transparent account's coins for ANML, minted as a note:
  // the way into ANML for an ERTH holder (ANML never sits in an account).
  rpc BuyAnml(MsgBuyAnml) returns (MsgBuyAnmlResponse);

  // AddLiquidityShielded deposits both legs from shielded notes (one bundle
  // releasing the pool token and ERTH) and mints the LP shares as a note.
  // Unsigned private msg; the only way to add to the ANML/ERTH pool.
  rpc AddLiquidityShielded(MsgAddLiquidityShielded) returns (MsgAddLiquidityShieldedResponse);

  // RemoveLiquidityShielded withdraws LP shares held as notes: both legs are
  // minted as notes when the unbonding matures. Unsigned private msg.
  rpc RemoveLiquidityShielded(MsgRemoveLiquidityShielded) returns (MsgRemoveLiquidityShieldedResponse);
}
// MsgUpdateParams is the Msg/UpdateParams request type.
message MsgUpdateParams {
  option (cosmos.msg.v1.signer) = "authority";
  option (amino.name) = "earth/x/dex/MsgUpdateParams";

  // authority is the address that controls the module (defaults to x/gov unless overwritten).
  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];

  // params defines the module parameters to update.

  // NOTE: All parameters must be supplied.
  Params params = 2 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
}

// MsgUpdateParamsResponse defines the response structure for executing a
// MsgUpdateParams message.
message MsgUpdateParamsResponse {}

// MsgCreatePool defines the MsgCreatePool message.
message MsgCreatePool {
  option (cosmos.msg.v1.signer) = "creator";
  string creator = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  cosmos.base.v1beta1.Coin amount_a = 2 [(gogoproto.nullable) = false];
  cosmos.base.v1beta1.Coin amount_b = 3 [(gogoproto.nullable) = false];
}

// MsgCreatePoolResponse defines the MsgCreatePoolResponse message.
message MsgCreatePoolResponse {
  uint64 pool_id = 1;
}

// MsgAddLiquidity defines the MsgAddLiquidity message.
message MsgAddLiquidity {
  option (cosmos.msg.v1.signer) = "creator";
  string creator = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  uint64 pool_id = 2;
  cosmos.base.v1beta1.Coin amount_a = 3 [(gogoproto.nullable) = false];
  cosmos.base.v1beta1.Coin amount_b = 4 [(gogoproto.nullable) = false];

  // The fewest shares the depositor will accept, as a decimal integer.
  //
  // A deposit is priced at whatever ratio the pool holds when it executes, so
  // without this it is sandwichable in the ordinary way: move the reserves
  // ahead of it, let it price against the moved ratio, move them back. MsgSwap
  // has always had min_amount_out for exactly this and add-liquidity had
  // nothing.
  //
  // Empty means no minimum, which is what every client sent before this field
  // existed and is why it can be added without breaking them. It is not a
  // recommendation -- a client that leaves it empty is choosing the old
  // behaviour.
  string min_shares = 5;
}

// MsgAddLiquidityResponse defines the MsgAddLiquidityResponse message.
message MsgAddLiquidityResponse {
  cosmos.base.v1beta1.Coin shares = 1 [(gogoproto.nullable) = false];
}

// MsgRemoveLiquidity defines the MsgRemoveLiquidity message.
message MsgRemoveLiquidity {
  option (cosmos.msg.v1.signer) = "creator";
  string creator = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  uint64 pool_id = 2;

  // shares is the amount of LP shares to burn.
  cosmos.base.v1beta1.Coin shares = 3 [(gogoproto.nullable) = false];

  // pc receives the token leg as a shielded note, for a pool whose token is
  // shielded-only (ANML): required there, refused anywhere else. The ERTH leg
  // is paid to creator as usual. 32 bytes, zk/privacy.PC.
  bytes pc = 4;
  // ciphertext is the token note encrypted to its owner (optional).
  bytes ciphertext = 5;
}

// MsgRemoveLiquidityResponse defines the MsgRemoveLiquidityResponse message.
//
// No amounts are returned: the payout is priced when the unbonding matures, not
// when it starts, because the shares keep earning and stay exposed to the pool
// in the meantime.
message MsgRemoveLiquidityResponse {
  // completion_time is the unix timestamp (seconds) at which the liquidity is
  // swept to the provider's wallet.
  int64 completion_time = 1;
}

// MsgSwap swaps token_in for denom_out. The dex routes through the ERTH hub, so
// a token->token swap is executed as two hops (token_in->ERTH->denom_out).
message MsgSwap {
  option (cosmos.msg.v1.signer) = "creator";
  string creator = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  cosmos.base.v1beta1.Coin token_in = 2 [(gogoproto.nullable) = false];
  string denom_out = 3;
  string min_amount_out = 4;
}

// MsgSwapResponse defines the MsgSwapResponse message.
message MsgSwapResponse {
  cosmos.base.v1beta1.Coin token_out = 1 [(gogoproto.nullable) = false];
}

// MsgStartLiquidityAuction opens the bidding window.
//
// The ERTH is already on the module account and already earmarked at genesis,
// so this does not move funds -- it chooses the bid asset and the deadline,
// which are the only two things that cannot be known before IBC exists.
message MsgStartLiquidityAuction {
  option (cosmos.msg.v1.signer) = "authority";
  option (amino.name) = "earth/x/dex/MsgStartLiquidityAuction";

  // authority is the address that controls the module (defaults to x/gov).
  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];

  // bid_denom is the asset bids are denominated in. It must not already have a
  // pool: the dex allows one pool per spoke token, and settlement creates one.
  string bid_denom = 2;

  // duration_seconds is how long bidding stays open, measured from the block
  // that executes this message.
  int64 duration_seconds = 3;
}

// MsgStartLiquidityAuctionResponse is the response type.
message MsgStartLiquidityAuctionResponse {
  // end_time is the unix timestamp (seconds) at which bidding closes.
  int64 end_time = 1;
}

// MsgBidLiquidityAuction contributes to the open auction. Bids are additive and
// cannot be withdrawn.
message MsgBidLiquidityAuction {
  option (cosmos.msg.v1.signer) = "bidder";
  string bidder = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  cosmos.base.v1beta1.Coin amount = 2 [(gogoproto.nullable) = false];
}

// MsgBidLiquidityAuctionResponse is the response type.
message MsgBidLiquidityAuctionResponse {
  // total_bid is the bidder's cumulative contribution after this message.
  cosmos.base.v1beta1.Coin total_bid = 1 [(gogoproto.nullable) = false];
}

// MsgClaimLiquidityAuction pays out a bidder's share of the bidder earmark.
message MsgClaimLiquidityAuction {
  option (cosmos.msg.v1.signer) = "bidder";
  string bidder = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
}

// MsgClaimLiquidityAuctionResponse is the response type.
message MsgClaimLiquidityAuctionResponse {
  cosmos.base.v1beta1.Coin amount = 1 [(gogoproto.nullable) = false];
}

// MsgNoteSwap releases bundle's balance of one asset (the asset in, public)
// into the dex, swaps it for denom_out through the ERTH hub (one or two hops,
// any pools), and mints the output to pc as a note. It has NO signer:
// authorization is the bundle (action proofs and binding signature over the
// sighash), replay protection its nullifiers (see x/shielded/ante).
//
// bundle's balances: the asset in, plus the uerth fee (for an ERTH swap the
// uerth balance is amount in + fee). The release map, after fee, must hold
// exactly one positive denom: the asset in.
//
// The swap runs in the private ante, atomically with the spend: if the
// output would fall below min_amount_out the whole tx fails and nothing is
// spent. Only the amounts and the pools are visible.
//
// fee_from_output > 0 pays the tx fee out of the output instead of from the
// bundle: denom_out must be uerth, fee 0 and min_amount_out >
// fee_from_output; pc receives the output less the fee.
//
// sighash fields: Bytes(denom_out), min_amount_out, pc, Bytes(ciphertext),
// fee_from_output, fee.
message MsgNoteSwap {
  earth.shielded.v1.Bundle bundle = 1 [(gogoproto.nullable) = false];
  string denom_out = 2;
  // min_amount_out is the least output (before fee_from_output) accepted.
  uint64 min_amount_out = 3;
  bytes pc = 4;
  bytes ciphertext = 5;
  uint64 fee_from_output = 6;
  // fee is paid from bundle's uerth balance (0 with fee_from_output).
  uint64 fee = 7;
}

// MsgNoteSwapResponse returns the swap's output (before any fee from output)
// and the minted note's position.
message MsgNoteSwapResponse {
  cosmos.base.v1beta1.Coin token_out = 1 [(gogoproto.nullable) = false];
  uint64 position = 2;
}

// MsgBuyAnml swaps token_in from creator (ERTH, or any token with a pool,
// through ERTH) for ANML and mints the ANML to pc as a note.
message MsgBuyAnml {
  option (cosmos.msg.v1.signer) = "creator";
  string creator = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  cosmos.base.v1beta1.Coin token_in = 2 [(gogoproto.nullable) = false];
  // min_amount_out is the least uanml accepted, a decimal integer.
  string min_amount_out = 3;
  bytes pc = 4;
  bytes ciphertext = 5;
}

// MsgBuyAnmlResponse returns the ANML bought and the note's position.
message MsgBuyAnmlResponse {
  cosmos.base.v1beta1.Coin token_out = 1 [(gogoproto.nullable) = false];
  uint64 position = 2;
}

// MsgAddLiquidityShielded deposits into pool_id from one bundle whose
// balances are the pool's token (ANML) and uerth: the token balance is the
// token leg, the uerth balance less fee the ERTH leg. The deposit is taken in
// the pool ratio, as MsgAddLiquidity's is; whatever of each leg the ratio
// does not take is minted back to refund_pc as a note.
//
// LP shares are private: the shares (dexlp/<pool_id>, a shielded-pool asset)
// are minted as a note to share_pc. No account appears in the msg, its
// events or state. The note leaves the pool only through
// MsgRemoveLiquidityShielded (an unshield of dexlp/* is refused).
//
// The deposit runs in the private ante, atomically with the spend: below
// min_shares the whole tx fails and nothing is spent.
//
// sighash fields: pool_id, Bytes(min_shares), share_pc,
// Bytes(share_ciphertext), refund_pc, Bytes(refund_ciphertext), fee.
message MsgAddLiquidityShielded {
  earth.shielded.v1.Bundle bundle = 1 [(gogoproto.nullable) = false];
  uint64 pool_id = 3;
  // min_shares is the fewest shares accepted, a decimal integer ("" = none).
  string min_shares = 5;
  bytes refund_pc = 6;
  bytes refund_ciphertext = 7;
  // fee is paid from bundle's uerth balance; the rest of it is the ERTH leg.
  uint64 fee = 8;
  // share_pc receives the LP shares as a note.
  bytes share_pc = 9;
  bytes share_ciphertext = 10;
  // erth_transfer: the ERTH leg is part of bundle. provider: shares are a
  // note to share_pc.
  reserved 2, 4;
  reserved "erth_transfer", "provider";
}

// MsgAddLiquidityShieldedResponse returns the shares minted and the refunds.
message MsgAddLiquidityShieldedResponse {
  cosmos.base.v1beta1.Coin shares = 1 [(gogoproto.nullable) = false];
  cosmos.base.v1beta1.Coin refund_erth = 2 [(gogoproto.nullable) = false];
  cosmos.base.v1beta1.Coin refund_token = 3 [(gogoproto.nullable) = false];
  // share_position is the share note's position in the note tree.
  uint64 share_position = 4;
}

// MsgRemoveLiquidityShielded begins a private withdrawal from pool_id. bundle
// releases dexlp/<pool_id> (the shares, from notes) and the uerth fee; the
// release map after the fee must hold exactly the shares of this pool.
//
// The shares are escrowed on the dex module for lp_unbonding_seconds, as
// MsgRemoveLiquidity's are (they keep earning; the payout is priced at
// maturity), in an LpUnbonding with no account: at maturity the sweep mints
// the ERTH leg to erth_pc and the token leg to token_pc, both as notes.
//
// Runs in the private ante, atomically with the spend.
//
// sighash fields: pool_id, erth_pc, Bytes(erth_ciphertext), token_pc,
// Bytes(token_ciphertext), fee.
message MsgRemoveLiquidityShielded {
  earth.shielded.v1.Bundle bundle = 1 [(gogoproto.nullable) = false];
  uint64 pool_id = 2;
  uint64 fee = 3;
  bytes erth_pc = 4;
  bytes erth_ciphertext = 5;
  bytes token_pc = 6;
  bytes token_ciphertext = 7;
}

// MsgRemoveLiquidityShieldedResponse returns when the withdrawal pays out
// (unix seconds).
message MsgRemoveLiquidityShieldedResponse {
  int64 completion_time = 1;
}
