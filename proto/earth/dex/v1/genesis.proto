syntax = "proto3";

package earth.dex.v1;

import "amino/amino.proto";
import "earth/dex/v1/params.proto";
import "earth/dex/v1/pool.proto";
import "earth/dex/v1/unbonding.proto";
import "gogoproto/gogo.proto";

option go_package = "github.com/earth-network/earth/x/dex/types";

// GenesisState defines the dex module's genesis state.
message GenesisState {
  // params defines all the parameters of the module.
  Params params = 1 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  repeated Pool pool_map = 2 [(gogoproto.nullable) = false];

  // lp_unbondings carries liquidity withdrawals that were still in flight at
  // export, so an upgrade does not strand escrowed shares on the module account.
  repeated LpUnbonding lp_unbondings = 3 [(gogoproto.nullable) = false];
}
