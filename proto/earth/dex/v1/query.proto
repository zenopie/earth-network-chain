syntax = "proto3";

package earth.dex.v1;

import "amino/amino.proto";
import "cosmos/base/query/v1beta1/pagination.proto";
import "cosmos/base/v1beta1/coin.proto";
import "cosmos_proto/cosmos.proto";
import "earth/dex/v1/auction.proto";
import "earth/dex/v1/params.proto";
import "earth/dex/v1/pool.proto";
import "earth/dex/v1/unbonding.proto";
import "gogoproto/gogo.proto";
import "google/api/annotations.proto";

option go_package = "github.com/earth-network/earth/x/dex/types";

// Query defines the gRPC querier service.
service Query {
  // Parameters queries the parameters of the module.
  rpc Params(QueryParamsRequest) returns (QueryParamsResponse) {
    option (google.api.http).get = "/earth-network/earth/dex/v1/params";
  }

  // ListPool Queries a list of Pool items.
  rpc GetPool(QueryGetPoolRequest) returns (QueryGetPoolResponse) {
    option (google.api.http).get = "/earth-network/earth/dex/v1/pool/{pool_id}";
  }

  // ListPool defines the ListPool RPC.
  rpc ListPool(QueryAllPoolRequest) returns (QueryAllPoolResponse) {
    option (google.api.http).get = "/earth-network/earth/dex/v1/pool";
  }

  // LpUnbondings lists a provider's withdrawals still waiting to mature.
  //
  // A withdrawal pays out on its own when the escrow ends, with nothing more to
  // sign, so without this a provider has no way to see that it is coming or
  // when — the shares have left their balance and the assets have not arrived.
  rpc LpUnbondings(QueryLpUnbondingsRequest) returns (QueryLpUnbondingsResponse) {
    option (google.api.http).get = "/earth-network/earth/dex/v1/unbondings/{address}";
  }

  // LiquidityAuction returns the genesis liquidity auction's current state.
  rpc LiquidityAuction(QueryLiquidityAuctionRequest) returns (QueryLiquidityAuctionResponse) {
    option (google.api.http).get = "/earth-network/earth/dex/v1/liquidity_auction";
  }

  // AuctionBid returns one bidder's contribution and whether they have claimed.
  rpc AuctionBid(QueryAuctionBidRequest) returns (QueryAuctionBidResponse) {
    option (google.api.http).get = "/earth-network/earth/dex/v1/liquidity_auction/bid/{bidder}";
  }

  // PolBurns returns every live protocol-owned-liquidity retirement schedule.
  rpc PolBurns(QueryPolBurnsRequest) returns (QueryPolBurnsResponse) {
    option (google.api.http).get = "/earth-network/earth/dex/v1/pol_burns";
  }
}
// QueryParamsRequest is request type for the Query/Params RPC method.
message QueryParamsRequest {}

// QueryParamsResponse is response type for the Query/Params RPC method.
message QueryParamsResponse {
  // params holds all the parameters of this module.
  Params params = 1 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
}

// QueryGetPoolRequest defines the QueryGetPoolRequest message.
message QueryGetPoolRequest {
  uint64 pool_id = 1;
}

// QueryGetPoolResponse defines the QueryGetPoolResponse message.
message QueryGetPoolResponse {
  Pool pool = 1 [(gogoproto.nullable) = false];
}

// QueryAllPoolRequest defines the QueryAllPoolRequest message.
message QueryAllPoolRequest {
  cosmos.base.query.v1beta1.PageRequest pagination = 1;
}

// QueryAllPoolResponse defines the QueryAllPoolResponse message.
message QueryAllPoolResponse {
  repeated Pool pool = 1 [(gogoproto.nullable) = false];
  cosmos.base.query.v1beta1.PageResponse pagination = 2;
}

// QueryLpUnbondingsRequest is request type for the Query/LpUnbondings RPC method.
message QueryLpUnbondingsRequest {
  // address is the provider whose pending withdrawals to list.
  string address = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
}

// QueryLpUnbondingsResponse is response type for the Query/LpUnbondings RPC method.
message QueryLpUnbondingsResponse {
  repeated LpUnbonding unbondings = 1 [(gogoproto.nullable) = false];
}

// QueryLiquidityAuctionRequest is the request type for Query/LiquidityAuction.
message QueryLiquidityAuctionRequest {}

// QueryLiquidityAuctionResponse is the response type for Query/LiquidityAuction.
message QueryLiquidityAuctionResponse {
  LiquidityAuction auction = 1;
}

// QueryAuctionBidRequest is the request type for Query/AuctionBid.
message QueryAuctionBidRequest {
  string bidder = 1;
}

// QueryAuctionBidResponse is the response type for Query/AuctionBid.
message QueryAuctionBidResponse {
  AuctionBid bid = 1 [(gogoproto.nullable) = false];
  // claimable is the ERTH this bidder can take right now: their pro-rata share
  // after settlement, or zero before it.
  cosmos.base.v1beta1.Coin claimable = 2 [(gogoproto.nullable) = false];
}

// QueryPolBurnsRequest is the request type for Query/PolBurns.
message QueryPolBurnsRequest {}

// QueryPolBurnsResponse is the response type for Query/PolBurns. A schedule
// that has finished is deleted, so an empty list means the protocol holds no
// liquidity that is still being retired.
message QueryPolBurnsResponse {
  repeated PolBurn pol_burns = 1 [(gogoproto.nullable) = false];
}
