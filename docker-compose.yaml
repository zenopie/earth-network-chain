# Release: https://github.com/zenopie/earth-network-chain/releases/tag/v0.1.6
# Workflow URL: https://github.com/zenopie/earth-network-chain/actions/runs/32206324658
# Commit: https://github.com/zenopie/earth-network-chain/commit/b36ad7fc15973dcd475455fa910908eff0bcaa38
# Dockerfile Path: Dockerfile
# Docker Compose Location: ./docker-compose.yaml
version: '3'
services:
  app:
    image: ghcr.io/zenopie/earth-network-chain@sha256:ef687fa3eb6f1494e03082f4822de83894021614c5af12747d2478af9cf61f3d
    ports:
      # Explicit host mappings: EARTH_NODE_URL and both wallet apps need
      # a fixed address. The short form publishes on a random host port.
      - '1317:1317'   # LCD  — wallet apps and the ads-for-gas backend
      - '26657:26657' # RPC  — the explorer's block-range queries
    volumes:
      # Genesis, the validator's consensus key and all chain state.
      # Without this a redeploy does not restart the chain, it creates a
      # different one: new genesis, new keys, and every address the apps
      # knew about stops existing. The entrypoint tells the two cases
      # apart purely by whether /data/config/genesis.json is present.
      - earth-data:/data
    restart: unless-stopped

volumes:
  earth-data:
