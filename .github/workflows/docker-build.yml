name: Build and Push Docker Image

on:
  push:
    # Tags only. Listing branches alongside tags makes them alternatives rather
    # than a conjunction, so adding `branches` here means every push to master
    # builds and publishes an image.
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  # read, not write: this workflow no longer commits anything back.
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Get the version
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Set lowercase repository name
        id: set_repo
        run: echo "REPO_NAME=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build Docker image
        id: build
        run: |
          # VERSION and COMMIT are passed in rather than derived inside the
          # build: .git is not in the build context, so a value invented there
          # would be a guess. They end up in `earthd version`, which is how an
          # operator answers "am I running what everyone else is running".
          #
          # Tagged with the version only. :latest is deliberately not built or
          # pushed — the SDL pins by digest, and a mutable tag alongside it is
          # just a way for someone to skip that.
          docker build \
            --build-arg VERSION=${{ steps.get_version.outputs.VERSION }} \
            --build-arg COMMIT=${{ github.sha }} \
            -t ghcr.io/${{ steps.set_repo.outputs.REPO_NAME }}:${{ steps.get_version.outputs.VERSION }} \
            -f Dockerfile .


      - name: Push Docker image
        id: push
        run: |
          docker push ghcr.io/${{ steps.set_repo.outputs.REPO_NAME }}:${{ steps.get_version.outputs.VERSION }}

          # Get the manifest digest after pushing
          MANIFEST_DIGEST=$(docker inspect ghcr.io/${{ steps.set_repo.outputs.REPO_NAME }}:${{ steps.get_version.outputs.VERSION }} --format='{{index .RepoDigests 0}}' | cut -d'@' -f2 | cut -d':' -f2)
          echo "IMAGE_HASH=${MANIFEST_DIGEST}" >> $GITHUB_OUTPUT          

      # Deliberately does NOT write the digest anywhere.
      #
      # This used to check out master, rewrite docker-compose.yaml and the Akash
      # SDL with the digest it had just pushed, and commit that back. Two things
      # were wrong with it: this repository carried deployment state it has no
      # business holding, and a build racing a human push meant one of them lost
      # — which happened.
      #
      # Deployment now lives in a separate private repository, which resolves
      # tag -> digest from the registry when it deploys. Anyone can do the same
      # with no credentials:
      #
      #   TOKEN=$(curl -s "https://ghcr.io/token?scope=repository:<repo>:pull&service=ghcr.io" | jq -r .token)
      #   curl -sI -H "Authorization: Bearer $TOKEN" \
      #        -H "Accept: application/vnd.docker.distribution.manifest.v2+json" \
      #        "https://ghcr.io/v2/<repo>/manifests/<tag>" | grep -i docker-content-digest

      - name: Output Image URL
        run: |
          echo "IMAGE_URL=ghcr.io/${{ steps.set_repo.outputs.REPO_NAME }}:${{ steps.get_version.outputs.VERSION }}" >> $GITHUB_OUTPUT
          echo "WORKFLOW_ID=${{ github.run_id }}" >> $GITHUB_OUTPUT

      - name: Notify Workflow Status
        if: always()
        run: |
          echo "Workflow Status: ${{ job.status }}"
          echo "Image URL: ghcr.io/${{ steps.set_repo.outputs.REPO_NAME }}:${{ steps.get_version.outputs.VERSION }}"
          echo "Workflow ID: ${{ github.run_id }}"