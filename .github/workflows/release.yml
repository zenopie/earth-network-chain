# Publishes downloadable `earthd` binaries when a version tag is pushed.
#
# An operator has to be able to get the binary without building it. Before this,
# tagging produced a Docker image and nothing else.
#
# Built natively per platform, not cross-compiled. earthd links the Barretenberg
# proof verifier through cgo, and cross-compiling cgo means cross-compiling that
# too — so each platform builds on its own runner and fetches its own
# libbarretenberg.a, checksum-verified against third_party/barretenberg-go/checksums.json.
#
# Linux only. Validators run Linux; a macOS build would need two more runners and
# nobody would validate on it. `make install` still works anywhere.
#
# Tags only, and the pattern is deliberate: listing `branches` alongside `tags`
# makes them alternatives rather than a conjunction, which is how the old version
# of this workflow ended up firing on every push and was disabled.
name: release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (must already exist)"
        required: true

permissions:
  contents: write

jobs:
  build:
    name: earthd ${{ matrix.goarch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            goarch: amd64
          - runner: ubuntu-24.04-arm
            goarch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-go@v6
        with:
          # Pinned, not "stable": the compiler is an input to the binary, and it
          # must match the Dockerfile's toolchain or the image and the download
          # are two different builds.
          go-version: "1.25.10"
          cache: true

      # libc++ specifically, not libstdc++ — build-wrapper.sh compiles the
      # verifier shim with -stdlib=libc++ to match Aztec's prebuilt archive.
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang python3 binutils libc++-dev libc++abi-dev

      - name: Build the UltraHonk verifier library
        run: |
          cd third_party/barretenberg-go
          ./scripts/build-wrapper.sh --platform "linux_${{ matrix.goarch }}"

      - name: Build earthd
        id: build
        env:
          VERSION: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          # -trimpath so the binary does not vary with the checkout path, and the
          # same ldflags the Dockerfile uses so `earthd version` reports the tag.
          #
          # The rpath is what makes the tarball portable. earthd links libwasmvm
          # dynamically, and wasmvm's own cgo directive bakes in
          #   -Wl,-rpath,<the builder's Go module cache>
          # which exists on this runner and nowhere else. Up to v0.4.5 that was
          # the only rpath in the binary, so every downloaded release failed with
          # "libwasmvm.x86_64.so: cannot open shared object file" the moment it
          # ran off this machine. The Docker image hid the bug by copying the .so
          # into /usr/local/lib and running ldconfig.
          #
          # $ORIGIN is resolved by the loader at run time, not by the shell, so it
          # follows the binary wherever it is unpacked. bin/earthd finds
          # ../lib/libwasmvm.*.so whether that is inside a release directory, a
          # cosmovisor upgrade directory, or /usr/local/bin next to /usr/local/lib.
          CGO_ENABLED=1 go build -trimpath \
            -ldflags "-X github.com/cosmos/cosmos-sdk/version.Name=earth \
                      -X github.com/cosmos/cosmos-sdk/version.AppName=earthd \
                      -X github.com/cosmos/cosmos-sdk/version.Version=${VERSION} \
                      -X github.com/cosmos/cosmos-sdk/version.Commit=${GITHUB_SHA} \
                      -extldflags '-Wl,-rpath,\$ORIGIN/../lib'" \
            -o earthd ./cmd/earthd

          ./earthd version --long | head -20

          # bin/ and lib/ sit at the ARCHIVE ROOT, with no wrapper directory.
          # That is not cosmetic. cosmovisor's downloadUpgradeAsArchive unpacks
          # the release straight into the upgrade directory and then looks for
          # exactly one of two layouts:
          #
          #   /<daemonName>       -> moved to /bin/<daemonName>
          #   /bin/<daemonName>   -> used as-is
          #
          # A wrapper directory -- earthd_v0.4.5_linux_amd64/bin/earthd, which is
          # what releases up to v0.4.5 shipped -- matches neither, and the
          # download fails at the halt height with the chain already stopped.
          #
          # Rooting it here also makes the rpath land correctly: unpacked into
          # cosmovisor/upgrades/<name>/, bin/earthd resolves $ORIGIN/../lib to
          # that same upgrade's lib/, so each staged version carries the exact
          # libwasmvm it was built against.
          NAME="earthd_${VERSION}_linux_${{ matrix.goarch }}"
          mkdir -p "dist/$NAME/bin" "dist/$NAME/lib"
          cp earthd "dist/$NAME/bin/"
          cp LICENSE "dist/$NAME/"

          # Ship the libraries that are version-locked to this binary, and only
          # those. libc, libm and the loader deliberately stay the host's --
          # bundling those is how you get a binary that segfaults on a different
          # distro rather than one that is more portable.
          #
          # libwasmvm is the critical one: its ABI moves with the CosmWasm
          # version this build compiled against, so a node must never pair one
          # release's earthd with another release's libwasmvm.
          for lib in libwasmvm libc++ libc++abi libunwind; do
            path=$(ldd earthd | awk -v l="$lib" '$1 ~ "^"l"\\." {print $3}')
            if [ -z "$path" ] || [ ! -f "$path" ]; then
              echo "::error::could not resolve $lib from ldd output"; ldd earthd; exit 1
            fi
            # -L to dereference: these resolve through symlink chains, and a
            # dangling symlink in the tarball is a broken binary at the far end.
            cp -L "$path" "dist/$NAME/lib/"
            echo "  bundled $(basename "$path")"
          done

          # -C into the directory and name its contents, so the archive holds
          # bin/, lib/ and LICENSE rather than $NAME/bin/...
          tar -C "dist/$NAME" -czf "dist/$NAME.tar.gz" bin lib LICENSE
          echo "--- archive layout ---"
          tar -tzf "dist/$NAME.tar.gz"
          ( cd dist && sha256sum "$NAME.tar.gz" > "$NAME.tar.gz.sha256" )
          cat "dist/$NAME.tar.gz.sha256"
          echo "NAME=$NAME" >> "$GITHUB_OUTPUT"

      # The check that would have caught the broken tarball. debian:trixie-slim is
      # the runtime image's base and has no libc++, no libwasmvm and no Go module
      # cache -- so this passes only if the tarball genuinely carries what it needs.
      # Running it on the build runner proves nothing, because everything is
      # already installed there.
      - name: Verify the tarball runs on a clean machine
        if: matrix.goarch == 'amd64'
        run: |
          docker run --rm -v "$PWD/dist:/dist:ro" debian:trixie-slim bash -eu -c '
            # Unpack the way cosmovisor does: contents straight into a bare
            # directory, then run <dir>/bin/earthd. If the archive ever regains a
            # wrapper directory this fails here rather than at an upgrade height.
            mkdir -p /tmp/upgrade
            tar -C /tmp/upgrade -xzf /dist/${{ steps.build.outputs.NAME }}.tar.gz
            test -x /tmp/upgrade/bin/earthd \
              || { echo "::error::bin/earthd is not at the archive root"; find /tmp/upgrade | head -20; exit 1; }
            echo "--- ldd (no host libc++ or libwasmvm installed) ---"
            ldd /tmp/upgrade/bin/earthd || true
            /tmp/upgrade/bin/earthd version --long | head -5
            echo "tarball is self-contained and cosmovisor-shaped"
          '

      - uses: actions/upload-artifact@v7
        with:
          name: earthd-linux-${{ matrix.goarch }}
          path: dist/*.tar.gz*
          if-no-files-found: error

  publish:
    name: publish release
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      # One file an operator can check everything against, including the genesis.
      # The genesis hash is what decides whether a node joins this chain or forks
      # its own, so it belongs in the release, not just in the repo.
      - name: Assemble checksums
        id: sums
        run: |
          cd dist
          cat *.tar.gz.sha256 > checksums.txt
          # awk, not sed: `sha256sum <path>` prints "<hash>  <path>", and a
          # `s|.*/|...|` matches up to the LAST slash — which swallows the hash
          # along with the directory. The first dry run published
          # "genesis.json  genesis.json" because of exactly that.
          sha256sum "$GITHUB_WORKSPACE/networks/genesis.json" \
            | awk '{print $1 "  genesis.json"}' >> checksums.txt
          echo "--- checksums.txt ---"; cat checksums.txt
          {
            echo 'GENESIS_SHA<<EOF'
            awk '{print $1}' "$GITHUB_WORKSPACE/networks/genesis.json.sha256"
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          # Anything with a suffix — v1.2.3-rc1 — is a pre-release. Those never
          # match the tag trigger either, so they only ever arrive by hand.
          prerelease: ${{ contains(github.event.inputs.tag || github.ref_name, '-') }}
          files: |
            dist/*.tar.gz
            dist/checksums.txt
            networks/genesis.json
          body: |
            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/${{ github.event.inputs.tag || github.ref_name }}/CHANGELOG.md)
            for what changed, including anything consensus-affecting.

            ## Running a node

            See [docs/JOIN.md](https://github.com/${{ github.repository }}/blob/${{ github.event.inputs.tag || github.ref_name }}/docs/JOIN.md).

            **Genesis sha256** — a node whose genesis does not match this one is
            on a different chain:

            ```
            ${{ steps.sums.outputs.GENESIS_SHA }}
            ```

            Verify a download against `checksums.txt`:

            ```
            sha256sum -c checksums.txt --ignore-missing
            ```

            Binaries are built natively on Linux amd64 and arm64 with
            `-trimpath` and a pinned Go toolchain. The container image for the
            same tag is at `ghcr.io/${{ github.repository }}`.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
