# Builds the documentation site and publishes it to GitHub Pages.
#
# Runs on any push to master that touches docs-site/, and can be triggered by
# hand. It also builds on pull requests without publishing, so a broken link is
# caught in review rather than after it is live — the site is configured to fail
# the build on one.
name: docs

on:
  push:
    branches: [master]
    paths:
      - "docs-site/**"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs-site/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

# Action versions are the current node24 majors. GitHub deprecated node20 and now
# force-runs those actions on node24 anyway, which is a warning today and will be
# a failure later. upload-artifact@v7 and download-artifact@v8 are the pairing
# GitHub's own README documents; they are on different majors deliberately.

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time. Cancelling a queued run rather than an in-progress
# one means a burst of merges does not abort a publish half way through.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: docs-site
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: docs-site/package-lock.json

      - run: npm ci
      - run: npm run build

      - uses: actions/upload-pages-artifact@v5
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        with:
          path: docs-site/build

  deploy:
    needs: build
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
