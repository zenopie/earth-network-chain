# Single-validator earth node.
#
# CI regenerates this file on every build to pin the image digest — see
# .github/workflows/docker-build-secretvm.yml. Edit the heredoc there, not here,
# or your change is overwritten by the next build.
version: '3'
services:
  app:
    image: ghcr.io/zenopie/earth-network-chain:latest
    ports:
      - '1317:1317'   # LCD  — wallet apps and the ads-for-gas backend
      - '26657:26657' # RPC  — the explorer's block-range queries
    volumes:
      # Genesis, the validator's consensus key and all chain state. Without this
      # a redeploy does not restart the chain, it creates a different one: new
      # genesis, new keys, and every address the apps knew about stops existing.
      - earth-data:/data
    restart: unless-stopped

volumes:
  earth-data:
