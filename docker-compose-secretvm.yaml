# Single-validator earth node.
#
# The image tag is rewritten to a pinned digest by
# .github/workflows/docker-build-secretvm.yml when a v*.*.* tag is pushed, the
# same way earth-network-backend does it.
version: '3'
services:
  chain:
    image: ghcr.io/zenopie/earth-network-chain:latest
    ports:
      - '1317'   # LCD  — wallet apps and the ads-for-gas backend
      - '26657'  # RPC  — explorer block-range queries
      - '9090'   # gRPC
    environment:
      MONIKER: earth-secretvm
      MIN_GAS_PRICES: 0uerth
    volumes:
      # Chain state, genesis and validator keys. Without this a redeploy starts a
      # brand new chain: new genesis, new keys, no history, and every address the
      # apps knew about ceases to exist.
      - earth-data:/data
    restart: unless-stopped

volumes:
  earth-data:
